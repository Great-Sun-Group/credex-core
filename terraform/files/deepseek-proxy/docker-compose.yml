version: '3.8'

services:
  deepseek-proxy:
    build: .
    restart: always
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - AWS_REGION=af-south-1
      - SAGEMAKER_ENDPOINT=deepseek-serverless-${ENVIRONMENT}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
    volumes:
      - ~/.aws:/root/.aws:ro
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    depends_on:
      - redis

  redis:
    image: redis:alpine
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 128M

volumes:
  redis-data:
