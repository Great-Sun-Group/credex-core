server {
    listen 80;
    server_name localhost;

    # Neo4j Ledger Browser proxy configuration
    location /neo4jbrowser-ledger/ {
        # Authentication temporarily disabled
        # auth_basic "Neo4j Browser Access";
        # auth_basic_user_file /etc/nginx/.htpasswd;
        
        # Proxy to Neo4j Browser
        proxy_pass http://neo4j-ledger:7474/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket support for Neo4j Browser
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Handle redirects properly
        proxy_redirect http://localhost/ http://$host:8080/neo4jbrowser-ledger/;
        
        # Modify the response to replace bolt URLs
        sub_filter 'bolt://localhost:7687' 'bolt://localhost:7687';
        sub_filter 'neo4j://localhost:7687' 'neo4j://localhost:7687';
        sub_filter_once off;
        sub_filter_types application/json;
    }

    # Neo4j Search Browser proxy configuration
    location /neo4jbrowser-search/ {
        # Authentication temporarily disabled
        # auth_basic "Neo4j Search Browser Access";
        # auth_basic_user_file /etc/nginx/.htpasswd;
        
        proxy_pass http://neo4j-search:7474/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Handle redirects properly
        proxy_redirect http://localhost/ http://$host:8080/neo4jbrowser-search/;
        
        # No URL substitutions to prevent automatic connections
    }
    
    # Specific location for the Neo4j Search Browser browser path with no auto-connect
    location /neo4jbrowser-search/browser/ {
        proxy_pass http://neo4j-search:7474/browser/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Handle redirects properly
        proxy_redirect http://localhost/ http://$host:8080/neo4jbrowser-search/;
        
        # Disable automatic connections by removing connection data from localStorage
        sub_filter '</head>' '<script>
        // Function to clear connection data
        function clearConnectionData() {
            console.log("Clearing connection data");
            if (window.localStorage) {
                // Remove all connection-related items
                Object.keys(localStorage).forEach(function(key) {
                    if (key.includes("connection") || key.includes("Connection") || 
                        key.includes("bolt") || key.includes("neo4j") || 
                        key.includes("credentials") || key.includes("auth")) {
                        console.log("Removing:", key);
                        localStorage.removeItem(key);
                    }
                });
            }
            
            // Disable any auto-connect features
            if (window.neo4j) {
                console.log("Disabling auto-connect");
                if (window.neo4j.connectionsManager) {
                    window.neo4j.connectionsManager.autoConnect = function() {
                        console.log("Auto-connect prevented");
                        return false;
                    };
                }
            }
        }
        
        // Clear on page load
        window.addEventListener("load", clearConnectionData);
        
        // Clear periodically to prevent auto-connect
        setInterval(clearConnectionData, 1000);
        </script></head>';
        
        sub_filter_once off;
        sub_filter_types text/html;
    }
    
    # Create a completely separate entry point for the search database
    location = /search-db {
        add_header Content-Type text/html;
        return 200 '
        <!DOCTYPE html>
        <html>
        <head>
            <title>Neo4j Search Database Connection</title>
            <style>
                body { font-family: Arial, sans-serif; margin: 20px; line-height: 1.6; }
                .container { max-width: 800px; margin: 0 auto; }
                h1 { color: #0056b3; }
                .info { background-color: #e9f7fe; border-left: 4px solid #0056b3; padding: 15px; margin: 20px 0; }
                code { background-color: #f5f5f5; padding: 2px 5px; border-radius: 3px; font-family: monospace; }
                .button { display: inline-block; background-color: #0056b3; color: white; padding: 10px 15px; 
                          text-decoration: none; border-radius: 4px; margin-top: 20px; }
                .button:hover { background-color: #003d82; }
            </style>
        </head>
        <body>
            <div class="container">
                <h1>Neo4j Search Database Connection</h1>
                
                <div class="info">
                    <p>To connect to the search database, use the following connection details:</p>
                    <ul>
                        <li><strong>Connection URL:</strong> <code>bolt://localhost:7688</code></li>
                        <li><strong>Database:</strong> <code>searchspace</code> (or leave blank for default)</li>
                        <li><strong>Authentication:</strong> No authentication required (leave username/password blank)</li>
                    </ul>
                </div>
                
                <p>Click the button below to open the Neo4j Browser for the search database. You will need to manually enter the connection details above.</p>
                
                <a href="/neo4jbrowser-search/browser/" class="button" target="_blank">Open Neo4j Search Browser</a>
                
                <h2>Troubleshooting</h2>
                <p>If you are automatically connected to the wrong database:</p>
                <ol>
                    <li>Open browser developer tools (F12)</li>
                    <li>Go to Application tab > Storage > Local Storage</li>
                    <li>Clear all items</li>
                    <li>Refresh the page</li>
                </ol>
            </div>
        </body>
        </html>
        ';
    }

    # Health check endpoint
    location /health {
        return 200 'OK';
        add_header Content-Type text/plain;
    }
}
