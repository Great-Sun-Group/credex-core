name: Deploy Databases

on:
  push:
    branches:
      - "*deploy*"
  workflow_dispatch:

jobs:
  deploy_neo4j:
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/prod' && 'production' || github.ref == 'refs/heads/stage' && 'staging' || 'development' }}

    env:
      ENVIRONMENT: ${{ github.ref == 'refs/heads/prod' && 'production' || github.ref == 'refs/heads/stage' && 'staging' || 'development' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.CREDEXCORE_DEV_AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.CREDEXCORE_DEV_AWS_SECRET_ACCESS_KEY }}
          aws-region: af-south-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Setup and Initialize Terraform Backend
        run: |
          echo "Current environment: ${ENVIRONMENT}"

          # Initialize Terraform
          cd terraform
          echo "Initializing Terraform..."
          terraform init \
            -backend-config="bucket=credex-terraform-state-${ENVIRONMENT}" \
            -backend-config="key=terraform.tfstate" \
            -backend-config="region=af-south-1" \
            -backend-config="dynamodb_table=credex-terraform-state-lock-${ENVIRONMENT}"

      - name: Terraform Plan
        env:
          TF_VAR_environment: ${{ env.ENVIRONMENT }}
          TF_VAR_neo4j_enterprise_license: ${{ secrets.NEO4J_ENTERPRISE_LICENSE }}
          # Add dummy values for required variables since they're not used by the databases module
          TF_VAR_jwt_secret: "dummy"
          TF_VAR_client_api_key: "dummy"
          TF_VAR_dev_admin_key: "dummy"
          TF_VAR_skip_rate_limiter_key: "dummy"
          TF_VAR_open_exchange_rates_api: "dummy"
          # Add dummy values for Neo4j connection details that will be replaced with real values after deployment
          TF_VAR_neo_4j_ledger_space_bolt_url: "bolt://dummy-ledger:7687"
          TF_VAR_neo_4j_search_space_bolt_url: "bolt://dummy-search:7687"
          TF_VAR_neo_4j_ledger_space_user: "neo4j"
          TF_VAR_neo_4j_search_space_user: "neo4j"
          TF_VAR_neo_4j_ledger_space_password: "dummy-password"
          TF_VAR_neo_4j_search_space_password: "dummy-password"
          # Add dummy values for Firebase variables since they're not used by the databases module
          TF_VAR_firebase_project_id: "dummy"
          TF_VAR_firebase_client_email: "dummy@project.iam.gserviceaccount.com"
          TF_VAR_firebase_private_key: "dummy-private-key"
        run: |
          cd terraform
          echo "Current environment: ${ENVIRONMENT}"
          echo "Planning Terraform changes..."
          terraform plan -input=false -out=tfplan -target=module.databases -replace="module.databases.aws_instance.neo4j_ledger" -replace="module.databases.aws_instance.neo4j_search"

      - name: Terraform Apply
        env:
          TF_VAR_environment: ${{ env.ENVIRONMENT }}
          TF_VAR_neo4j_enterprise_license: ${{ secrets.NEO4J_ENTERPRISE_LICENSE }}
          # Add dummy values for required variables since they're not used by the databases module
          TF_VAR_jwt_secret: "dummy"
          TF_VAR_client_api_key: "dummy"
          TF_VAR_dev_admin_key: "dummy"
          TF_VAR_skip_rate_limiter_key: "dummy"
          TF_VAR_open_exchange_rates_api: "dummy"
          # Add dummy values for Neo4j connection details that will be replaced with real values after deployment
          TF_VAR_neo_4j_ledger_space_bolt_url: "bolt://dummy-ledger:7687"
          TF_VAR_neo_4j_search_space_bolt_url: "bolt://dummy-search:7687"
          TF_VAR_neo_4j_ledger_space_user: "neo4j"
          TF_VAR_neo_4j_search_space_user: "neo4j"
          TF_VAR_neo_4j_ledger_space_password: "dummy-password"
          TF_VAR_neo_4j_search_space_password: "dummy-password"
          # Add dummy values for Firebase variables since they're not used by the databases module
          TF_VAR_firebase_project_id: "dummy"
          TF_VAR_firebase_client_email: "dummy@project.iam.gserviceaccount.com"
          TF_VAR_firebase_private_key: "dummy-private-key"
        run: |
          cd terraform
          echo "Current environment: ${ENVIRONMENT}"
          echo "Applying Terraform changes..."

          if ! terraform apply -auto-approve -input=false tfplan; then
            echo "Error: Terraform apply failed"
            echo "Checking terraform logs for details..."
            terraform show tfplan
            exit 1
          fi

          echo "Terraform apply completed successfully"

          echo "Waiting for resources to be created..."
          # EC2 instances take time to initialize
          # Wait up to 5 minutes checking every 30 seconds
          for i in {1..10}; do
            echo "Checking terraform outputs (attempt $i/10)..."
            # Extract and validate instance IDs
            LEDGER_ID=$(terraform output -raw neo4j_ledger_instance_id 2>/dev/null | tr -d '\n' | grep -o 'i-[a-z0-9]\{17\}' || echo "")
            SEARCH_ID=$(terraform output -raw neo4j_search_instance_id 2>/dev/null | tr -d '\n' | grep -o 'i-[a-z0-9]\{17\}' || echo "")
            
            if [ -n "$LEDGER_ID" ] && [ -n "$SEARCH_ID" ]; then
              echo "Found both instance IDs:"
              printf "  LedgerSpace: %s\n" "$LEDGER_ID"
              printf "  SearchSpace: %s\n" "$SEARCH_ID"
              # Verify IDs are clean
              echo "Verifying instance IDs format..."
              [[ "$LEDGER_ID" =~ ^i-[a-z0-9]{17}$ ]] && [[ "$SEARCH_ID" =~ ^i-[a-z0-9]{17}$ ]] || {
                echo "Error: Invalid instance ID format"
                exit 1
              }
              break
            fi
            
            if [ $i -eq 10 ]; then
              echo "Error: Timed out waiting for terraform outputs"
              exit 1
            fi
            
            echo "Waiting 30 seconds before next check..."
            sleep 30
          done

      - name: Verify Neo4j Deployments
        run: |
          cd terraform
          echo "Verifying Neo4j deployments..."

          # Extract and validate instance IDs
          LEDGER_ID=$(terraform output -raw neo4j_ledger_instance_id 2>/dev/null | tr -d '\n' | grep -o 'i-[a-z0-9]\{17\}' || echo "")
          SEARCH_ID=$(terraform output -raw neo4j_search_instance_id 2>/dev/null | tr -d '\n' | grep -o 'i-[a-z0-9]\{17\}' || echo "")

          if [ -z "$LEDGER_ID" ] || [ -z "$SEARCH_ID" ]; then
            echo "Error: Could not get Neo4j instance IDs"
            exit 1
          fi

          echo "Found instances:"
          printf "  LedgerSpace: %s\n" "$LEDGER_ID"
          printf "  SearchSpace: %s\n" "$SEARCH_ID"
          # Verify IDs are clean
          echo "Verifying instance IDs format..."
          [[ "$LEDGER_ID" =~ ^i-[a-z0-9]{17}$ ]] && [[ "$SEARCH_ID" =~ ^i-[a-z0-9]{17}$ ]] || {
            echo "Error: Invalid instance ID format"
            exit 1
          }

          # Clean instance IDs and store in array
          INSTANCE_IDS=("$LEDGER_ID" "$SEARCH_ID")

          echo "Waiting for instances to be running..."
          aws ec2 wait instance-running --instance-ids "${INSTANCE_IDS[@]}" || true
          
          echo "Waiting for instance status checks..."
          aws ec2 wait instance-status-ok --instance-ids "${INSTANCE_IDS[@]}" || true
          
          echo "Getting instance details..."
          aws ec2 describe-instances \
            --instance-ids "${INSTANCE_IDS[@]}" \
            --query 'Reservations[*].Instances[*].[InstanceId,State.Name,PrivateIpAddress]' \
            --output table || true

          echo "Neo4j instances verified successfully"

      - name: Print Database Infrastructure Outputs
        run: |
          cd terraform
          echo "Database Infrastructure Outputs:"
          echo "========================================"

          # Extract and clean instance IDs using the same pattern as before
          LEDGER_ID=$(terraform output -raw neo4j_ledger_instance_id 2>/dev/null | tr -d '\n' | grep -o 'i-[a-z0-9]\{17\}' || echo 'Not available')
          SEARCH_ID=$(terraform output -raw neo4j_search_instance_id 2>/dev/null | tr -d '\n' | grep -o 'i-[a-z0-9]\{17\}' || echo 'Not available')
          
          # Get bolt URLs
          LEDGER_BOLT=$(terraform output -raw neo4j_ledger_bolt_endpoint 2>/dev/null | tr -d '\n' || echo 'Not available')
          SEARCH_BOLT=$(terraform output -raw neo4j_search_bolt_endpoint 2>/dev/null | tr -d '\n' || echo 'Not available')

          echo "Neo4j LedgerSpace Instance:"
          printf "  Instance ID: %s\n" "$LEDGER_ID"
          printf "  Bolt URL: %s\n" "$LEDGER_BOLT"

          echo "Neo4j SearchSpace Instance:"
          printf "  Instance ID: %s\n" "$SEARCH_ID"
          printf "  Bolt URL: %s\n" "$SEARCH_BOLT"

          echo "========================================"
          echo "Remember to set up the following secrets:"
          echo "- NEO_4J_LEDGER_SPACE_BOLT_URL"
          echo "- NEO_4J_SEARCH_SPACE_BOLT_URL"
          echo "- NEO_4J_LEDGER_SPACE_USER"
          echo "- NEO_4J_SEARCH_SPACE_USER"
          echo "- NEO_4J_LEDGER_SPACE_PASS"
          echo "- NEO_4J_SEARCH_SPACE_PASS"
