services:
  server:
    build:
      context: .
      target: ${BUILD_TARGET:-production}
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-3000}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      JWT_SECRET: ${JWT_SECRET}
      CLIENT_API_KEY: ${CLIENT_API_KEY}
      DEV_ADMIN_KEY: ${DEV_ADMIN_KEY}
      SKIP_RATE_LIMITER_KEY: ${SKIP_RATE_LIMITER_KEY}
      PASSWORD_PEPPER: ${PASSWORD_PEPPER}
      CREDEX_CORE_WHATSAPP_API_KEY: ${CREDEX_CORE_WHATSAPP_API_KEY}
      CREDEX_CORE_WHATSAPP_BUSINESS_ID: ${CREDEX_CORE_WHATSAPP_BUSINESS_ID}
      CREDEX_CORE_WHATSAPP_PHONE_ID: ${CREDEX_CORE_WHATSAPP_PHONE_ID}
      OPEN_EXCHANGE_RATES_API: ${OPEN_EXCHANGE_RATES_API}
      NEO_4J_LEDGER_SPACE_BOLT_URL: ${NEO_4J_LEDGER_SPACE_BOLT_URL}
      NEO_4J_SEARCH_SPACE_BOLT_URL: ${NEO_4J_SEARCH_SPACE_BOLT_URL}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY}
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - ./logs:/app/logs
      - /app/node_modules
    restart: unless-stopped

  cloudwatch-agent:
    image: amazon/cloudwatch-agent:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      AWS_REGION: ${AWS_REGION:-af-south-1}
    profiles:
      - aws
