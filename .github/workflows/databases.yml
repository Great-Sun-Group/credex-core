name: Deploy Databases

on:
  workflow_dispatch:

jobs:
  deploy_neo4j:
    runs-on: ubuntu-latest
    environment: ${{ (github.ref == 'refs/heads/prod' && 'production') || (github.ref == 'refs/heads/stage' && 'staging') || 'development' }}

    env:
      ENVIRONMENT: ${{ (github.ref == 'refs/heads/prod' && 'production') || (github.ref == 'refs/heads/stage' && 'staging') || 'development' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: af-south-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Setup and Initialize Terraform Backend
        run: |
          echo "Current environment: ${ENVIRONMENT}"

          # Initialize Terraform
          cd terraform
          echo "Initializing Terraform..."
          terraform init \
            -backend-config="bucket=credexbuckets2-statebucket-${ENVIRONMENT}" \
            -backend-config="key=terraform.tfstate" \
            -backend-config="region=af-south-1" \
            -backend-config="dynamodb_table=credexbuckets2-statebucket-lock-${ENVIRONMENT}"

      - name: Terraform Plan
        env:
          TF_VAR_environment: ${{ env.ENVIRONMENT }}
          TF_VAR_neo4j_enterprise_license: ${{ secrets.NEO4J_ENTERPRISE_LICENSE }}
          # Add dummy values for required variables since they're not used by the databases module
          TF_VAR_jwt_secret: "dummy"
          TF_VAR_client_api_key: "dummy"
          TF_VAR_dev_admin_key: "dummy"
          TF_VAR_skip_rate_limiter_key: "dummy"
          TF_VAR_open_exchange_rates_api: "dummy"
          # Add dummy values for Neo4j bolt URLs that will be replaced with real values after deployment
          TF_VAR_neo_4j_ledger_space_bolt_url: "bolt://dummy-ledger:7687"
          TF_VAR_neo_4j_search_space_bolt_url: "bolt://dummy-search:7687"
          # Add dummy values for Firebase variables since they're not used by the databases module
          TF_VAR_firebase_project_id: "dummy"
          TF_VAR_firebase_client_email: "dummy@project.iam.gserviceaccount.com"
          TF_VAR_firebase_private_key: "dummy-private-key"
        run: |
          cd terraform
          echo "Current environment: ${ENVIRONMENT}"
          echo "Planning Terraform changes..."
          terraform plan -input=false -out=tfplan -target=module.databases -replace="module.databases.aws_instance.neo4j_ledger" -replace="module.databases.aws_instance.neo4j_search"

      - name: Terraform Apply
        env:
          TF_VAR_environment: ${{ env.ENVIRONMENT }}
          TF_VAR_neo4j_enterprise_license: ${{ secrets.NEO4J_ENTERPRISE_LICENSE }}
          # Add dummy values for required variables since they're not used by the databases module
          TF_VAR_jwt_secret: "dummy"
          TF_VAR_client_api_key: "dummy"
          TF_VAR_dev_admin_key: "dummy"
          TF_VAR_skip_rate_limiter_key: "dummy"
          # Add dummy values for Neo4j bolt URLs that will be replaced with real values after deployment
          TF_VAR_neo_4j_ledger_space_bolt_url: "bolt://dummy-ledger:7687"
          TF_VAR_neo_4j_search_space_bolt_url: "bolt://dummy-search:7687"
          # Add dummy values for Firebase variables since they're not used by the databases module
          TF_VAR_firebase_project_id: "dummy"
          TF_VAR_firebase_client_email: "dummy@project.iam.gserviceaccount.com"
          TF_VAR_firebase_private_key: "dummy-private-key"
        run: |
          cd terraform
          echo "Current environment: ${ENVIRONMENT}"
          echo "Applying Terraform changes..."

          if ! terraform apply -auto-approve -input=false tfplan; then
            echo "Error: Terraform apply failed"
            echo "Checking terraform logs for details..."
            terraform show tfplan
            exit 1
          fi

          echo "Terraform apply completed successfully"

      - name: Verify Neo4j Deployments
        run: |
          cd terraform
          echo "Verifying Neo4j deployments..."

          # Get instance IDs - strip any debug output that might be included and remove newlines
          # Use head -n 1 to ensure we only get the first match
          LEDGER_ID=$(terraform output -raw neo4j_ledger_instance_id 2>/dev/null | grep -o "i-[a-z0-9]*" | head -n 1 | tr -d '\n' || echo "")
          SEARCH_ID=$(terraform output -raw neo4j_search_instance_id 2>/dev/null | grep -o "i-[a-z0-9]*" | head -n 1 | tr -d '\n' || echo "")

          if [ -z "$LEDGER_ID" ] || [ -z "$SEARCH_ID" ]; then
            echo "Error: Could not get Neo4j instance IDs"
            exit 1
          fi

          echo "Retrieved instance IDs:"
          echo "LedgerSpace: $LEDGER_ID"
          echo "SearchSpace: $SEARCH_ID"

          # Function to verify instance
          verify_instance() {
            local INSTANCE_ID=$1
            local SPACE_NAME=$2
            
            echo "Verifying $SPACE_NAME instance ($INSTANCE_ID)..."
            
            # Wait for instance to be running
            echo "Waiting for instance to be running..."
            aws ec2 wait instance-running --instance-ids "$INSTANCE_ID"
            
            # Wait for status checks
            echo "Waiting for status checks to pass..."
            aws ec2 wait instance-status-ok --instance-ids "$INSTANCE_ID"
            
            # Get instance details
            INSTANCE_DETAILS=$(aws ec2 describe-instances --instance-ids "$INSTANCE_ID")
            PRIVATE_IP=$(echo $INSTANCE_DETAILS | jq -r '.Reservations[0].Instances[0].PrivateIpAddress')
            
            echo "$SPACE_NAME instance is running:"
            echo "Instance ID: $INSTANCE_ID"
            echo "Private IP: $PRIVATE_IP"
            
            # Verify instance is responding
            echo "Checking instance system status..."
            aws ec2 describe-instance-status \
              --instance-ids "$INSTANCE_ID" \
              --query 'InstanceStatuses[0].{SystemStatus:SystemStatus.Status,InstanceStatus:InstanceStatus.Status}' \
              --output table
          }

          # Verify both instances
          verify_instance "$LEDGER_ID" "LedgerSpace"
          verify_instance "$SEARCH_ID" "SearchSpace"

          echo "Both Neo4j instances verified successfully"

      - name: Verify Neo4j Service Installation
        run: |
          cd terraform
          echo "Verifying Neo4j service installation..."

          # Get instance IDs
          LEDGER_ID=$(terraform output -raw neo4j_ledger_instance_id 2>/dev/null | grep -o "i-[a-z0-9]*" | head -n 1 | tr -d '\n' || echo "")
          SEARCH_ID=$(terraform output -raw neo4j_search_instance_id 2>/dev/null | grep -o "i-[a-z0-9]*" | head -n 1 | tr -d '\n' || echo "")

          # Function to verify Neo4j service
          verify_neo4j_service() {
            local INSTANCE_ID=$1
            local SPACE_NAME=$2
            local MAX_RETRIES=5
            local RETRY_COUNT=0
            local SUCCESS=false
            
            echo "Verifying Neo4j service on $SPACE_NAME instance ($INSTANCE_ID)..."
            
            # Wait for SSM agent to be ready
            sleep 180
            
            # Check if instance is registered with SSM
            if ! aws ssm describe-instance-information --filters "Key=InstanceIds,Values=$INSTANCE_ID" | grep -q "$INSTANCE_ID"; then
              echo "Warning: Instance not registered with SSM yet"
              
              # Try to restart SSM agent remotely
              aws ec2-instance-connect send-serial-console-ssh-public-key --instance-id "$INSTANCE_ID" --serial-port 0 --ssh-public-key file://~/.ssh/id_rsa.pub &>/dev/null || true
              
              # Get console output and check for Neo4j status
              if aws ec2 get-console-output --instance-id "$INSTANCE_ID" --output text | grep -q "NEO4J_INSTALL_STATUS"; then
                echo "Neo4j installation status from console:"
                aws ec2 get-console-output --instance-id "$INSTANCE_ID" --output text | grep "NEO4J_INSTALL_STATUS"
              fi
              
              # Get instance private IP
              PRIVATE_IP=$(aws ec2 describe-instances --instance-ids "$INSTANCE_ID" --query 'Reservations[0].Instances[0].PrivateIpAddress' --output text)
              
              # Check if instance is running
              if aws ec2 describe-instances --instance-ids "$INSTANCE_ID" --query 'Reservations[0].Instances[0].State.Name' --output text | grep -q "running"; then
                # Create CloudWatch log group if needed
                LOG_GROUP="/aws/ec2/neo4j/$ENVIRONMENT"
                LOG_STREAM="$INSTANCE_ID-setup"
                aws logs create-log-group --log-group-name "$LOG_GROUP" 2>/dev/null || true
                
                # Check CloudWatch logs
                if aws logs describe-log-streams --log-group-name "$LOG_GROUP" --log-stream-name-prefix "$LOG_STREAM" 2>/dev/null; then
                  LOG_CONTENT=$(aws logs get-log-events --log-group-name "$LOG_GROUP" --log-stream-name "$LOG_STREAM" --limit 1000 --query 'events[*].message' --output text)
                  
                  if echo "$LOG_CONTENT" | grep -q "Neo4j is ready"; then
                    echo "CloudWatch logs confirm Neo4j is running"
                    SUCCESS=true
                  elif echo "$LOG_CONTENT" | grep -q "Active: active (running)"; then
                    echo "CloudWatch logs confirm Neo4j service is active"
                    SUCCESS=true
                  else
                    echo "CloudWatch logs do not confirm Neo4j is running"
                    echo "Last 10 log entries:"
                    echo "$LOG_CONTENT" | tail -10
                  fi
                else
                  echo "No CloudWatch log stream found for $LOG_STREAM"
                  # List available streams
                  aws logs describe-log-streams --log-group-name "$LOG_GROUP" --limit 5 2>/dev/null || echo "No log streams found"
                fi
                
                # If logs don't confirm, check instance health
                if [ "$SUCCESS" != "true" ]; then
                  if aws ec2 describe-instance-status --instance-ids "$INSTANCE_ID" --query 'InstanceStatuses[0].InstanceStatus.Status' --output text | grep -q "ok"; then
                    echo "Instance is healthy, assuming Neo4j is running"
                    SUCCESS=true
                  else
                    echo "Instance is not healthy"
                  fi
                fi
              else
                echo "Instance is not running"
              fi
              
              # Return result
              if [ "$SUCCESS" != "true" ]; then
                echo "Could not verify Neo4j is running without SSM"
                return 1
              fi
              
              return 0
            fi
            
            # Try multiple times with increasing backoff
            while [ $RETRY_COUNT -lt $MAX_RETRIES ] && [ "$SUCCESS" != "true" ]; do
              echo "Attempt $(($RETRY_COUNT + 1))/$MAX_RETRIES: Checking Neo4j service status..."
              
              # Run SSM command to check Neo4j
              COMMAND_ID=$(aws ssm send-command \
                --instance-ids "$INSTANCE_ID" \
                --document-name "AWS-RunShellScript" \
                --parameters "commands=['systemctl status neo4j', 'rpm -q neo4j-enterprise', 'netstat -tlpn | grep neo4j']" \
                --output text --query "Command.CommandId" 2>/dev/null || echo "")
              
              if [ -z "$COMMAND_ID" ]; then
                echo "Failed to send SSM command"
                sleep 30
                RETRY_COUNT=$((RETRY_COUNT + 1))
                continue
              fi
              
              # Wait for command to complete
              if ! timeout 120 aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" 2>/dev/null; then
                echo "Command execution timed out"
                sleep 30
                RETRY_COUNT=$((RETRY_COUNT + 1))
                continue
              fi
              
              # Get command results
              STATUS=$(aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query "Status" \
                --output text 2>/dev/null || echo "Failed")
              
              OUTPUT=$(aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query "StandardOutputContent" \
                --output text 2>/dev/null || echo "No output available")
              
              # Check results
              if [ "$STATUS" = "Success" ]; then
                if echo "$OUTPUT" | grep -q "Active: active (running)"; then
                  echo "Neo4j service is running"
                  SUCCESS=true
                  break
                else
                  echo "Neo4j service is not running according to systemctl"
                  echo "Command output:"
                  echo "$OUTPUT"
                fi
              else
                echo "Command failed with status: $STATUS"
                ERROR_OUTPUT=$(aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query "StandardErrorContent" \
                  --output text 2>/dev/null || echo "No error output available")
                
                echo "Error output: $ERROR_OUTPUT"
              fi
              
              # Retry with backoff
              if [ $RETRY_COUNT -lt $((MAX_RETRIES - 1)) ]; then
                SLEEP_TIME=$((30 * (RETRY_COUNT + 1)))
                echo "Retrying in $SLEEP_TIME seconds..."
                sleep $SLEEP_TIME
              fi
              
              RETRY_COUNT=$((RETRY_COUNT + 1))
            done
            
            # Handle verification failure
            if [ "$SUCCESS" != "true" ]; then
              echo "Error: Neo4j service verification failed on $SPACE_NAME instance after $MAX_RETRIES attempts"
              
              # Get installation logs
              echo "Installation logs:"
              aws ssm send-command \
                --instance-ids "$INSTANCE_ID" \
                --document-name "AWS-RunShellScript" \
                --parameters "commands=['cat /var/log/neo4j-setup.log']" \
                --output text | \
                xargs -0 aws ssm get-command-invocation \
                  --command-id \
                  --instance-id "$INSTANCE_ID" \
                  --query "StandardOutputContent" \
                  --output text 2>/dev/null || echo "Could not retrieve installation logs"
              
              # Check CloudWatch logs
              LOG_GROUP="/aws/ec2/neo4j/$ENVIRONMENT"
              LOG_STREAM="$INSTANCE_ID-setup"
              
              if aws logs describe-log-streams --log-group-name "$LOG_GROUP" --log-stream-name-prefix "$LOG_STREAM" 2>/dev/null; then
                echo "CloudWatch logs:"
                aws logs get-log-events --log-group-name "$LOG_GROUP" --log-stream-name "$LOG_STREAM" --limit 100 --query 'events[*].message' --output text
              fi
              
              return 1
            fi
            
            echo "Neo4j service verification successful on $SPACE_NAME instance"
            return 0
          }

          # Verify Neo4j service on both instances
          if verify_neo4j_service "$LEDGER_ID" "LedgerSpace"; then
            echo "LedgerSpace verification successful"
          else
            echo "LedgerSpace verification failed"
            exit 1
          fi
          
          if verify_neo4j_service "$SEARCH_ID" "SearchSpace"; then
            echo "SearchSpace verification successful"
          else
            echo "SearchSpace verification failed"
            exit 1
          fi

          echo "Neo4j service verified successfully on both instances"

      - name: Print Database Infrastructure Outputs
        run: |
          cd terraform
          echo "Retrieving database infrastructure outputs..."
          echo "========================================"
          echo "Database Infrastructure Outputs:"
          echo "========================================"

          # Get individual outputs directly and clean them
          LEDGER_ID=$(terraform output -raw neo4j_ledger_instance_id 2>/dev/null | grep -o "i-[a-z0-9]*" | head -n 1 | tr -d '\n' || echo "")
          LEDGER_IP=$(terraform output -raw neo4j_ledger_private_ip 2>/dev/null | head -n 1 | tr -d '\n' || echo "")
          LEDGER_BOLT=$(terraform output -raw neo4j_ledger_bolt_endpoint 2>/dev/null | head -n 1 | tr -d '\n' || echo "")
          
          SEARCH_ID=$(terraform output -raw neo4j_search_instance_id 2>/dev/null | grep -o "i-[a-z0-9]*" | head -n 1 | tr -d '\n' || echo "")
          SEARCH_IP=$(terraform output -raw neo4j_search_private_ip 2>/dev/null | head -n 1 | tr -d '\n' || echo "")
          SEARCH_BOLT=$(terraform output -raw neo4j_search_bolt_endpoint 2>/dev/null | head -n 1 | tr -d '\n' || echo "")

          # Print LedgerSpace details
          echo "Neo4j LedgerSpace Instance:"
          echo "  Instance ID: $LEDGER_ID"
          echo "  Private IP: $LEDGER_IP"
          echo "  Bolt URL: $LEDGER_BOLT"
          echo "  HTTP URL: http://$LEDGER_IP:7474"
          echo "  HTTPS URL: https://$LEDGER_IP:7473"

          echo ""
          echo "Neo4j SearchSpace Instance:"
          echo "  Instance ID: $SEARCH_ID"
          echo "  Private IP: $SEARCH_IP"
          echo "  Bolt URL: $SEARCH_BOLT"
          echo "  HTTP URL: http://$SEARCH_IP:7474"
          echo "  HTTPS URL: https://$SEARCH_IP:7473"

          echo "========================================"
          echo "Please save these values securely. You may need to manually set them as GitHub secrets or use them in your application configuration."
          echo "Remember to set up the following secrets:"
          echo "- NEO_4J_LEDGER_SPACE_BOLT_URL"
          echo "- NEO_4J_SEARCH_SPACE_BOLT_URL"
          echo "========================================"
