name: Deploy to Local Environment

on:
  push:
    branches: [ prod ]
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy'
        required: false
        default: 'prod'
        type: choice
        options:
          - prod
          - main
      force_deploy:
        description: 'Force deploy current code (ignores commit changes)'
        required: false
        default: false
        type: boolean
      deployment_reason:
        description: 'Reason for manual deployment'
        required: false
        default: 'Manual deployment'
        type: string

jobs:
  deploy-credex-core:
    runs-on: ubuntu-latest
    environment: ${{ (github.ref == 'refs/heads/prod' && 'production') || (github.ref == 'refs/heads/stage' && 'staging') || 'development' }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set deployment variables
        id: vars
        run: |
          BRANCH="${{ github.event.inputs.branch || 'prod' }}"
          COMMIT_SHA="${{ github.sha }}"
          echo "branch=${BRANCH}" >> $GITHUB_OUTPUT
          echo "commit_sha=${COMMIT_SHA}" >> $GITHUB_OUTPUT
          echo "deployment_id=credex-core-$(date +%s)" >> $GITHUB_OUTPUT

      - name: Deploy credex-core service
        id: deploy
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          echo "🚀 Starting deployment of credex-core service..."
          echo "Branch: ${{ steps.vars.outputs.branch }}"
          echo "Commit: ${{ steps.vars.outputs.commit_sha }}"
          echo "Deployment ID: ${{ steps.vars.outputs.deployment_id }}"
          echo "GitHub Ref: ${{ github.ref }}"
          echo "Environment: ${{ (github.ref == 'refs/heads/prod' && 'production') || (github.ref == 'refs/heads/stage' && 'staging') || 'development' }}"
          echo "Deploy Token Length: ${#DEPLOY_TOKEN}"
          
          # Show manual deployment info if triggered manually
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "🔧 Manual Deployment Triggered"
            echo "Reason: ${{ github.event.inputs.deployment_reason || 'Manual deployment' }}"
            echo "Force Deploy: ${{ github.event.inputs.force_deploy || 'false' }}"
            echo "Triggered by: ${{ github.actor }}"
          fi
          
          # Prepare deployment payload
          PAYLOAD=$(cat <<EOF
          {
            "service": "credex-core",
            "deploy_token": "$DEPLOY_TOKEN",
            "branch": "${{ steps.vars.outputs.branch }}",
            "commit_sha": "${{ steps.vars.outputs.commit_sha }}"
          }
          EOF
          )
          
          echo "📡 Calling deployment API..."
          echo "Payload (token masked): $(echo "$PAYLOAD" | sed 's/"deploy_token": "[^"]*"/"deploy_token": "[MASKED]"/')"
          
          # Call deployment API with retry logic
          MAX_RETRIES=3
          RETRY_COUNT=0
          SUCCESS=false
          
          while [ $RETRY_COUNT -lt $MAX_RETRIES ] && [ "$SUCCESS" = false ]; do
            RETRY_COUNT=$((RETRY_COUNT + 1))
            echo "Attempt $RETRY_COUNT of $MAX_RETRIES..."
            
            RESPONSE=$(curl -s -w "\n%{http_code}" \
              -X POST \
              -H "Content-Type: application/json" \
              -H "X-Request-ID: ${{ steps.vars.outputs.deployment_id }}" \
              -d "$PAYLOAD" \
              https://mycredex.app/api/deploy-core)
            
            HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
            RESPONSE_BODY=$(echo "$RESPONSE" | head -n -1)
            
            echo "HTTP Status: $HTTP_CODE"
            echo "Response: $RESPONSE_BODY"
            
            if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "202" ]; then
              SUCCESS=true
              if [ "$HTTP_CODE" = "200" ]; then
                echo "✅ Deployment completed successfully!"
              else
                echo "✅ Deployment queued successfully!"
              fi
              echo "response_body=$RESPONSE_BODY" >> $GITHUB_OUTPUT
              break
            elif [ "$HTTP_CODE" = "401" ]; then
              echo "❌ Authentication failed - invalid deploy token"
              exit 1
            elif [ "$RETRY_COUNT" -lt "$MAX_RETRIES" ]; then
              echo "⏳ Deployment failed, retrying in 30 seconds..."
              sleep 30
            fi
          done
          
          if [ "$SUCCESS" = false ]; then
            echo "❌ Deployment failed after $MAX_RETRIES attempts"
            echo "Final response: $RESPONSE_BODY"
            exit 1
          fi

      - name: Verify deployment
        run: |
          echo "🔍 Verifying deployment..."
          
          # Wait a moment for services to stabilize
          sleep 10
          
          # Check API health
          echo "Checking API health..."
          HEALTH_CHECK=$(curl -s -o /dev/null -w "%{http_code}" https://mycredex.app/api-docs || echo "000")
          
          if [ "$HEALTH_CHECK" = "200" ]; then
            echo "✅ API health check passed"
          else
            echo "⚠️  API health check returned: $HEALTH_CHECK"
            echo "This may be normal if the service is still starting up"
          fi

      - name: Report deployment status
        if: always()
        run: |
          if [ "${{ steps.deploy.outcome }}" = "success" ]; then
            echo "🎉 Deployment Summary:"
            echo "✅ Service: credex-core"
            echo "✅ Branch: ${{ steps.vars.outputs.branch }}"
            echo "✅ Commit: ${{ steps.vars.outputs.commit_sha }}"
            echo "✅ Status: Successfully deployed"
            echo "✅ Timestamp: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo ""
            echo "🔗 Service URLs:"
            echo "   • API: https://mycredex.app"
            echo "   • Docs: https://mycredex.app/api-docs"
          else
            echo "❌ Deployment Failed:"
            echo "   • Service: credex-core"
            echo "   • Branch: ${{ steps.vars.outputs.branch }}"
            echo "   • Commit: ${{ steps.vars.outputs.commit_sha }}"
            echo "   • Status: Failed"
            echo "   • Timestamp: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo ""
            echo "🔧 Troubleshooting:"
            echo "   • Check deployment token in repository secrets"
            echo "   • Verify production deployment API is running at https://mycredex.app"
            echo "   • Review deployment logs above"
          fi

      - name: Create deployment artifact
        if: success()
        run: |
          mkdir -p deployment-artifacts
          cat > deployment-artifacts/deployment-info.json <<EOF
          {
            "service": "credex-core",
            "branch": "${{ steps.vars.outputs.branch }}",
            "commit_sha": "${{ steps.vars.outputs.commit_sha }}",
            "deployment_id": "${{ steps.vars.outputs.deployment_id }}",
            "timestamp": "$(date -u '+%Y-%m-%dT%H:%M:%SZ')",
            "status": "success",
            "workflow_run_id": "${{ github.run_id }}",
            "actor": "${{ github.actor }}"
          }
          EOF

      - name: Upload deployment artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-info-${{ steps.vars.outputs.deployment_id }}
          path: deployment-artifacts/
          retention-days: 30
