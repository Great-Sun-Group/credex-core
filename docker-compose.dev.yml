version: "3.8"

services:
  server:
    build:
      context: .
      target: development
    depends_on:
      neo4j-ledger:
        condition: service_healthy
      neo4j-search:
        condition: service_healthy
    environment:
      # Core environment
      NODE_ENV: ${NODE_ENV:-development}
      DOCKER_ENV: "true"
      # Test configuration
      BUILD_TARGET: ${BUILD_TARGET:-test}
      TEST_FILTER: ${TEST_FILTER:-""}
      # API keys and secrets
      SKIP_RATE_LIMITER_KEY: ${SKIP_RATE_LIMITER_KEY}
      DEV_ADMIN_KEY: ${DEV_ADMIN_KEY}
      # Neo4j bolt URLs for local instances
      NEO_4J_LEDGER_SPACE_BOLT_URL: bolt://neo4j-ledger:7687
      NEO_4J_SEARCH_SPACE_BOLT_URL: bolt://neo4j-search:7687
      # Firebase configuration
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY}
      # Network configuration
      NODE_OPTIONS: "--dns-result-order=ipv4first"
      # AWS Configuration
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION:-af-south-1}
    # Environment variables are provided through Codespaces secrets or directly from the shell
    # No env_file directive to avoid errors when .env doesn't exist
    volumes:
      - .:/app
      - ./logs:/app/logs
      - /app/node_modules
    ports:
      - "3000:3000"

  # Download APOC plugin during startup
  apoc-setup:
    image: curlimages/curl:latest
    user: root
    command: |
      sh -c '
        mkdir -p /plugins &&
        echo "Downloading APOC plugin..." &&
        curl -L https://github.com/neo4j/apoc/releases/download/5.26.1/apoc-5.26.1-core.jar -o /plugins/apoc.jar &&
        echo "Setting permissions..." &&
        chmod -R 777 /plugins &&
        echo "APOC plugin downloaded and configured."
      '
    volumes:
      - neo4j-plugins:/plugins

  neo4j-ledger:
    image: neo4j:5-enterprise
    depends_on:
      apoc-setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider localhost:7474 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 30s
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: none
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
      # Memory settings from terraform
      NEO4J_server_memory_heap_initial__size: "512m"
      NEO4J_server_memory_heap_max__size: "512m"
      NEO4J_server_memory_pagecache_size: "1024m"
      # Memory management
      NEO4J_db_memory_pagecache_warmup_enable: "false"
      NEO4J_server_jvm_additional: "-XX:+UseG1GC -XX:G1HeapRegionSize=4m -XX:+UseStringDeduplication -XX:MaxGCPauseMillis=200 -XX:+ExitOnOutOfMemoryError -XX:+HeapDumpOnOutOfMemoryError"
      NEO4J_server_memory_off__heap_transaction__max__size: "256m"
      NEO4J_dbms_memory_transaction_total_max: "512m"
      # Other settings from terraform
      NEO4J_dbms_security_auth__enabled: "false"
      NEO4J_dbms_security_allow__csv__import__from__file__urls: "false"
      NEO4J_db_logs_query_enabled: "INFO"
      NEO4J_db_transaction_timeout: "5m"
      NEO4J_db_transaction_concurrent_maximum: "100"
      # Enable APOC procedures
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
      NEO4J_dbms_security_procedures_allowlist: "apoc.*"
      # Browser settings
      NEO4J_browser_remote__content__hostname__whitelist: "*"
      NEO4J_browser_allow__outgoing__connections: "true"
      NEO4J_server_default__advertised__address: "localhost"
    volumes:
      - neo4j-ledger-data:/data
      - neo4j-ledger-logs:/logs
      - neo4j-plugins:/plugins
    deploy:
      resources:
        limits:
          memory: 4G
      update_config:
        failure_action: rollback
    profiles:
      - dev

  neo4j-search:
    image: neo4j:5-enterprise
    depends_on:
      apoc-setup:
        condition: service_completed_successfully
      neo4j-ledger:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider localhost:7474 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 30s
    ports:
      - "7475:7474"
      - "7688:7687"
    environment:
      NEO4J_AUTH: none
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
      # Memory settings from terraform
      NEO4J_server_memory_heap_initial__size: "512m"
      NEO4J_server_memory_heap_max__size: "512m"
      NEO4J_server_memory_pagecache_size: "1024m"
      # Memory management
      NEO4J_db_memory_pagecache_warmup_enable: "false"
      NEO4J_server_jvm_additional: "-XX:+UseG1GC -XX:G1HeapRegionSize=4m -XX:+UseStringDeduplication -XX:MaxGCPauseMillis=200 -XX:+ExitOnOutOfMemoryError -XX:+HeapDumpOnOutOfMemoryError"
      NEO4J_server_memory_off__heap_transaction__max__size: "256m"
      NEO4J_dbms_memory_transaction_total_max: "512m"
      # Other settings from terraform
      NEO4J_dbms_security_auth__enabled: "false"
      NEO4J_dbms_security_allow__csv__import__from__file__urls: "false"
      NEO4J_db_logs_query_enabled: "INFO"
      NEO4J_db_transaction_timeout: "5m"
      NEO4J_db_transaction_concurrent_maximum: "100"
      # Enable APOC procedures
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
      NEO4J_dbms_security_procedures_allowlist: "apoc.*"
      # Browser settings
      NEO4J_browser_remote__content__hostname__whitelist: "*"
      NEO4J_browser_allow__outgoing__connections: "true"
      NEO4J_server_default__advertised__address: "localhost"
    volumes:
      - neo4j-search-data:/data
      - neo4j-search-logs:/logs
      - neo4j-plugins:/plugins
    deploy:
      resources:
        limits:
          memory: 4G
      update_config:
        failure_action: rollback
    profiles:
      - dev

volumes:
  neo4j-ledger-data:
  neo4j-ledger-logs:
  neo4j-search-data:
  neo4j-search-logs:
  neo4j-plugins:
