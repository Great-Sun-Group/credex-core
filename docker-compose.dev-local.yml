version: "3.8"

services:
  # Neo4j LedgerSpace Database
  neo4j-ledger:
    image: neo4j:5.15-enterprise
    container_name: credex-neo4j-ledger
    environment:
      NEO4J_AUTH: neo4j/password
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
      NEO4J_EDITION: enterprise
      NEO4J_PLUGINS: '["apoc"]'
      # License from environment variable
      NEO4J_ENTERPRISE_LICENSE: ${NEO4J_ENTERPRISE_LICENSE}
      # Disable strict validation to allow enterprise license
      NEO4J_server_config_strict__validation_enabled: "false"
      # Memory configuration for development
      NEO4J_dbms_memory_heap_initial__size: 512m
      NEO4J_dbms_memory_heap_max__size: 1g
      NEO4J_dbms_memory_pagecache_size: 512m
      # Network configuration
      NEO4J_dbms_default__listen__address: 0.0.0.0
      NEO4J_dbms_connector_bolt_listen__address: 0.0.0.0:7687
      NEO4J_dbms_connector_http_listen__address: 0.0.0.0:7474
      # Security
      NEO4J_dbms_security_auth__enabled: true
    ports:
      - "7687:7687"  # Bolt protocol
      - "7474:7474"  # HTTP interface
    volumes:
      - neo4j-ledger-data:/data
      - neo4j-ledger-logs:/logs
      - neo4j-ledger-import:/var/lib/neo4j/import
      - neo4j-ledger-plugins:/plugins
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p password 'RETURN 1'"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Neo4j SearchSpace Database  
  neo4j-search:
    image: neo4j:5.15-enterprise
    container_name: credex-neo4j-search
    environment:
      NEO4J_AUTH: neo4j/password
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
      NEO4J_EDITION: enterprise
      NEO4J_PLUGINS: '["apoc"]'
      # License from environment variable
      NEO4J_ENTERPRISE_LICENSE: ${NEO4J_ENTERPRISE_LICENSE}
      # Disable strict validation to allow enterprise license
      NEO4J_server_config_strict__validation_enabled: "false"
      # Memory configuration for development
      NEO4J_dbms_memory_heap_initial__size: 512m
      NEO4J_dbms_memory_heap_max__size: 1g
      NEO4J_dbms_memory_pagecache_size: 512m
      # Network configuration
      NEO4J_dbms_default__listen__address: 0.0.0.0
      NEO4J_dbms_connector_bolt_listen__address: 0.0.0.0:7687
      NEO4J_dbms_connector_http_listen__address: 0.0.0.0:7474
      # Security
      NEO4J_dbms_security_auth__enabled: true
    ports:
      - "7688:7687"  # Bolt protocol (mapped to different host port)
      - "7475:7474"  # HTTP interface (mapped to different host port)
    volumes:
      - neo4j-search-data:/data
      - neo4j-search-logs:/logs
      - neo4j-search-import:/var/lib/neo4j/import
      - neo4j-search-plugins:/plugins
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p password 'RETURN 1'"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Credex Core Application
  credex-core:
    build:
      context: .
      target: development
    container_name: credex-core-app
    environment:
      NODE_ENV: development
      PORT: 3000
      LOG_LEVEL: debug
      
      # Development Verification Settings
      USE_MOCK_VERIFICATION: "true"  # Enable mock verification with fixed OTP (123456)
      
      # Neo4j Configuration
      NEO_4J_LEDGER_SPACE_BOLT_URL: bolt://neo4j-ledger:7687
      NEO_4J_LEDGER_SPACE_USER: neo4j
      NEO_4J_LEDGER_SPACE_PASS: password
      NEO_4J_SEARCH_SPACE_BOLT_URL: bolt://neo4j-search:7687
      NEO_4J_SEARCH_SPACE_USER: neo4j
      NEO_4J_SEARCH_SPACE_PASS: password
      
      # Development Keys
      JWT_SECRET: dev-jwt-secret-key-change-in-production
      CLIENT_API_KEY: bdgyk83HjdhjtSfhy36msfthf
      DEV_ADMIN_KEY: dev-admin-key-for-testing
      SKIP_RATE_LIMITER_KEY: dev-skip-rate-limiter-key
      PASSWORD_PEPPER: dev-password-pepper-change-in-production
      
      # External APIs (placeholder values for development)
      OPEN_EXCHANGE_RATES_API: 8db9eabefc004a6e8fb69c4b6f40196d
      CREDEX_CORE_WHATSAPP_API_KEY: your_whatsapp_api_key_here
      CREDEX_CORE_WHATSAPP_BUSINESS_ID: whats-app-business-id
      CREDEX_CORE_WHATSAPP_PHONE_ID: whats-app-phone-id
      
      # Firebase (placeholder values for development)
      FIREBASE_PROJECT_ID: your-firebase-project-id
      FIREBASE_CLIENT_EMAIL: your-firebase-service-account-email
      FIREBASE_PRIVATE_KEY: "-----BEGIN PRIVATE KEY-----\nYour Firebase Private Key Here\n-----END PRIVATE KEY-----"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - ./logs:/app/logs
      - /app/node_modules
    depends_on:
      neo4j-ledger:
        condition: service_healthy
      neo4j-search:
        condition: service_healthy
    restart: unless-stopped

  # Vimbiso ChatServer Application
  vimbiso-chatserver:
    build:
      context: ../vimbiso-chatserver
      target: development
    container_name: vimbiso-chatserver-app
    environment:
      - DJANGO_ENV=development
      - DEBUG=True
      - ALLOWED_HOSTS=*
      - DJANGO_SECRET=dev-django-secret-key-change-in-production
      - REDIS_URL=redis://redis-state:6379/0
      - WHATSAPP_API_URL=http://mock-whatsapp:8001/
      - WHATSAPP_ACCESS_TOKEN=dev-mock-access-token
      - WHATSAPP_PHONE_NUMBER_ID=dev-mock-phone-id
      - WHATSAPP_BUSINESS_ID=dev-mock-business-id
      - MYCREDEX_APP_URL=http://credex-core:3000/
      - CLIENT_API_KEY=bdgyk83HjdhjtSfhy36msfthf
      - USE_PROGRESSIVE_FLOW=True
      - MOCK_TEST_KEY=dev-mock-test-key-for-testing
      - PORT=8000
    ports:
      - "8000:8000"
    volumes:
      - ../vimbiso-chatserver/app/data:/app/data
      - ../vimbiso-chatserver/app/core:/app/core
      - ../vimbiso-chatserver/app/config:/app/config
      - ../vimbiso-chatserver/app/services:/app/services
      - ../vimbiso-chatserver/app/manage.py:/app/manage.py
    command: ["bash", "-c", "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"]
    depends_on:
      redis-state:
        condition: service_healthy
      credex-core:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 2
      start_period: 20s
    restart: unless-stopped

  # Redis State Manager for Vimbiso ChatServer
  redis-state:
    image: redis:7.0-alpine
    container_name: vimbiso-redis-state
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 2
    restart: unless-stopped

  # Mock WhatsApp Server for Testing
  mock-whatsapp:
    build:
      context: ../vimbiso-chatserver
      target: development
    container_name: vimbiso-mock-whatsapp
    volumes:
      - ../vimbiso-chatserver/mock:/app/mock
    ports:
      - "8001:8001"
    environment:
      - MOCK_TEST_KEY=dev-mock-test-key-for-testing
    command: ["python3", "mock/server.py"]
    depends_on:
      - vimbiso-chatserver
    restart: unless-stopped

volumes:
  neo4j-ledger-data:
  neo4j-ledger-logs:
  neo4j-ledger-import:
  neo4j-ledger-plugins:
  neo4j-search-data:
  neo4j-search-logs:
  neo4j-search-import:
  neo4j-search-plugins:

networks:
  default:
    name: credex-dev-network
