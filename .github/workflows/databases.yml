name: Deploy Databases

on:
  workflow_dispatch:

jobs:
  deploy_neo4j:
    runs-on: ubuntu-latest
    environment: ${{ (github.ref == 'refs/heads/prod' && 'production') || (github.ref == 'refs/heads/stage' && 'staging') || 'development' }}

    env:
      ENVIRONMENT: ${{ (github.ref == 'refs/heads/prod' && 'production') || (github.ref == 'refs/heads/stage' && 'staging') || 'development' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: af-south-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Setup and Initialize Terraform Backend
        run: |
          echo "Current environment: ${ENVIRONMENT}"

          # Initialize Terraform
          cd terraform
          echo "Initializing Terraform..."
          terraform init \
            -backend-config="bucket=credexbuckets2-statebucket-${ENVIRONMENT}" \
            -backend-config="key=terraform.tfstate" \
            -backend-config="region=af-south-1" \
            -backend-config="dynamodb_table=credexbuckets2-statebucket-lock-${ENVIRONMENT}"

      - name: Terraform Plan
        env:
          TF_VAR_environment: ${{ env.ENVIRONMENT }}
          TF_VAR_neo4j_enterprise_license: ${{ secrets.NEO4J_ENTERPRISE_LICENSE }}
          # Add dummy values for required variables since they're not used by the databases module
          TF_VAR_jwt_secret: "dummy"
          TF_VAR_client_api_key: "dummy"
          TF_VAR_dev_admin_key: "dummy"
          TF_VAR_skip_rate_limiter_key: "dummy"
          TF_VAR_open_exchange_rates_api: "dummy"
          # Add dummy values for Neo4j bolt URLs that will be replaced with real values after deployment
          TF_VAR_neo_4j_ledger_space_bolt_url: "bolt://dummy-ledger:7687"
          TF_VAR_neo_4j_search_space_bolt_url: "bolt://dummy-search:7687"
          # Add dummy values for Firebase variables since they're not used by the databases module
          TF_VAR_firebase_project_id: "dummy"
          TF_VAR_firebase_client_email: "dummy@project.iam.gserviceaccount.com"
          TF_VAR_firebase_private_key: "dummy-private-key"
        run: |
          cd terraform
          echo "Current environment: ${ENVIRONMENT}"
          echo "Planning Terraform changes..."
          terraform plan -input=false -out=tfplan -target=module.databases -replace="module.databases.aws_instance.neo4j_ledger" -replace="module.databases.aws_instance.neo4j_search"

      - name: Terraform Apply
        env:
          TF_VAR_environment: ${{ env.ENVIRONMENT }}
          TF_VAR_neo4j_enterprise_license: ${{ secrets.NEO4J_ENTERPRISE_LICENSE }}
          # Add dummy values for required variables since they're not used by the databases module
          TF_VAR_jwt_secret: "dummy"
          TF_VAR_client_api_key: "dummy"
          TF_VAR_dev_admin_key: "dummy"
          TF_VAR_skip_rate_limiter_key: "dummy"
          # Add dummy values for Neo4j bolt URLs that will be replaced with real values after deployment
          TF_VAR_neo_4j_ledger_space_bolt_url: "bolt://dummy-ledger:7687"
          TF_VAR_neo_4j_search_space_bolt_url: "bolt://dummy-search:7687"
          # Add dummy values for Firebase variables since they're not used by the databases module
          TF_VAR_firebase_project_id: "dummy"
          TF_VAR_firebase_client_email: "dummy@project.iam.gserviceaccount.com"
          TF_VAR_firebase_private_key: "dummy-private-key"
        run: |
          cd terraform
          echo "Current environment: ${ENVIRONMENT}"
          echo "Applying Terraform changes..."

          if ! terraform apply -auto-approve -input=false tfplan; then
            echo "Error: Terraform apply failed"
            echo "Checking terraform logs for details..."
            terraform show tfplan
            exit 1
          fi

          echo "Terraform apply completed successfully"

      - name: Verify Neo4j Deployments
        run: |
          cd terraform
          echo "Verifying Neo4j deployments..."

          # Get instance IDs - strip any debug output that might be included and remove newlines
          # Use head -n 1 to ensure we only get the first match
          LEDGER_ID=$(terraform output -raw neo4j_ledger_instance_id 2>/dev/null | grep -o "i-[a-z0-9]*" | head -n 1 | tr -d '\n' || echo "")
          SEARCH_ID=$(terraform output -raw neo4j_search_instance_id 2>/dev/null | grep -o "i-[a-z0-9]*" | head -n 1 | tr -d '\n' || echo "")

          if [ -z "$LEDGER_ID" ] || [ -z "$SEARCH_ID" ]; then
            echo "Error: Could not get Neo4j instance IDs"
            exit 1
          fi

          echo "Retrieved instance IDs:"
          echo "LedgerSpace: $LEDGER_ID"
          echo "SearchSpace: $SEARCH_ID"

          # Function to verify instance
          verify_instance() {
            local INSTANCE_ID=$1
            local SPACE_NAME=$2
            
            echo "Verifying $SPACE_NAME instance ($INSTANCE_ID)..."
            
            # Wait for instance to be running
            echo "Waiting for instance to be running..."
            aws ec2 wait instance-running --instance-ids "$INSTANCE_ID"
            
            # Wait for status checks
            echo "Waiting for status checks to pass..."
            aws ec2 wait instance-status-ok --instance-ids "$INSTANCE_ID"
            
            # Get instance details
            INSTANCE_DETAILS=$(aws ec2 describe-instances --instance-ids "$INSTANCE_ID")
            PRIVATE_IP=$(echo $INSTANCE_DETAILS | jq -r '.Reservations[0].Instances[0].PrivateIpAddress')
            
            echo "$SPACE_NAME instance is running:"
            echo "Instance ID: $INSTANCE_ID"
            echo "Private IP: $PRIVATE_IP"
            
            # Verify instance is responding
            echo "Checking instance system status..."
            aws ec2 describe-instance-status \
              --instance-ids "$INSTANCE_ID" \
              --query 'InstanceStatuses[0].{SystemStatus:SystemStatus.Status,InstanceStatus:InstanceStatus.Status}' \
              --output table
          }

          # Verify both instances
          verify_instance "$LEDGER_ID" "LedgerSpace"
          verify_instance "$SEARCH_ID" "SearchSpace"

          echo "Both Neo4j instances verified successfully"

      - name: Install Neo4j Driver for Direct Connection Testing
        run: |
          npm install neo4j-driver

      - name: Verify Neo4j Connectivity
        run: |
          cd terraform
          echo "Verifying Neo4j connectivity..."

          # Get instance IPs - ensure clean output with no debug info
          LEDGER_IP=$(terraform output -raw neo4j_ledger_private_ip 2>/dev/null | grep -o '[0-9]\+\.[0-9]\+\.[0-9]\+\.[0-9]\+' | head -n 1 || echo "")
          SEARCH_IP=$(terraform output -raw neo4j_search_private_ip 2>/dev/null | grep -o '[0-9]\+\.[0-9]\+\.[0-9]\+\.[0-9]\+' | head -n 1 || echo "")

          if [ -z "$LEDGER_IP" ] || [ -z "$SEARCH_IP" ]; then
            echo "Error: Could not get Neo4j instance IPs"
            # Try a different approach to get IPs
            LEDGER_ID=$(terraform output -raw neo4j_ledger_instance_id 2>/dev/null | grep -o "i-[a-z0-9]*" | head -n 1 || echo "")
            SEARCH_ID=$(terraform output -raw neo4j_search_instance_id 2>/dev/null | grep -o "i-[a-z0-9]*" | head -n 1 || echo "")
            
            if [ -n "$LEDGER_ID" ]; then
              LEDGER_IP=$(aws ec2 describe-instances --instance-ids "$LEDGER_ID" --query 'Reservations[0].Instances[0].PrivateIpAddress' --output text)
            fi
            
            if [ -n "$SEARCH_ID" ]; then
              SEARCH_IP=$(aws ec2 describe-instances --instance-ids "$SEARCH_ID" --query 'Reservations[0].Instances[0].PrivateIpAddress' --output text)
            fi
            
            if [ -z "$LEDGER_IP" ] || [ -z "$SEARCH_IP" ]; then
              echo "Error: Still could not get Neo4j instance IPs"
              exit 1
            fi
          fi

          echo "Neo4j instance IPs:"
          echo "LedgerSpace: $LEDGER_IP"
          echo "SearchSpace: $SEARCH_IP"

          # Function to verify Neo4j connectivity
          verify_neo4j_connectivity() {
            local IP=$1
            local SPACE_NAME=$2
            local MAX_RETRIES=10
            local RETRY_COUNT=0
            local SUCCESS=false
            
            echo "Verifying Neo4j connectivity on $SPACE_NAME ($IP)..."
            
            # Wait for instance to be fully initialized
            sleep 180
            
            # Try multiple times with increasing backoff
            while [ $RETRY_COUNT -lt $MAX_RETRIES ] && [ "$SUCCESS" != "true" ]; do
              echo "Attempt $(($RETRY_COUNT + 1))/$MAX_RETRIES: Testing Neo4j Bolt connection..."
              
              # Test TCP connection to Neo4j Bolt port
              if nc -z -w 5 $IP 7687 2>/dev/null; then
                echo "Neo4j Bolt port is open"
                
                # Create a simple Node.js script to test Neo4j connection
                echo 'const neo4j = require("neo4j-driver");' > /tmp/test-neo4j-connection.js
                echo '' >> /tmp/test-neo4j-connection.js
                echo 'const uri = process.argv[2];' >> /tmp/test-neo4j-connection.js
                echo 'console.log(`Testing connection to: ${uri}`);' >> /tmp/test-neo4j-connection.js
                echo '' >> /tmp/test-neo4j-connection.js
                echo 'const driver = neo4j.driver(uri, neo4j.auth.basic("neo4j", "neo4j"), {' >> /tmp/test-neo4j-connection.js
                echo '  maxConnectionLifetime: 3000,' >> /tmp/test-neo4j-connection.js
                echo '  maxConnectionPoolSize: 1,' >> /tmp/test-neo4j-connection.js
                echo '  connectionAcquisitionTimeout: 5000,' >> /tmp/test-neo4j-connection.js
                echo '  connectionTimeout: 5000' >> /tmp/test-neo4j-connection.js
                echo '});' >> /tmp/test-neo4j-connection.js
                echo '' >> /tmp/test-neo4j-connection.js
                echo 'async function testConnection() {' >> /tmp/test-neo4j-connection.js
                echo '  const session = driver.session();' >> /tmp/test-neo4j-connection.js
                echo '  try {' >> /tmp/test-neo4j-connection.js
                echo '    const result = await session.run("RETURN 1 AS num");' >> /tmp/test-neo4j-connection.js
                echo '    console.log("Connection successful");' >> /tmp/test-neo4j-connection.js
                echo '    console.log(`Result: ${JSON.stringify(result.records[0].get("num"))}`);' >> /tmp/test-neo4j-connection.js
                echo '    return true;' >> /tmp/test-neo4j-connection.js
                echo '  } catch (error) {' >> /tmp/test-neo4j-connection.js
                echo '    console.error(`Connection failed: ${error.message}`);' >> /tmp/test-neo4j-connection.js
                echo '    return false;' >> /tmp/test-neo4j-connection.js
                echo '  } finally {' >> /tmp/test-neo4j-connection.js
                echo '    await session.close();' >> /tmp/test-neo4j-connection.js
                echo '    await driver.close();' >> /tmp/test-neo4j-connection.js
                echo '  }' >> /tmp/test-neo4j-connection.js
                echo '}' >> /tmp/test-neo4j-connection.js
                echo '' >> /tmp/test-neo4j-connection.js
                echo 'testConnection()' >> /tmp/test-neo4j-connection.js
                echo '  .then(success => process.exit(success ? 0 : 1))' >> /tmp/test-neo4j-connection.js
                echo '  .catch(error => {' >> /tmp/test-neo4j-connection.js
                echo '    console.error(`Error: ${error.message}`);' >> /tmp/test-neo4j-connection.js
                echo '    process.exit(1);' >> /tmp/test-neo4j-connection.js
                echo '  });' >> /tmp/test-neo4j-connection.js

                # Try to connect to Neo4j using the driver
                if node /tmp/test-neo4j-connection.js "bolt://$IP:7687"; then
                  echo "Successfully connected to Neo4j and executed a query"
                  SUCCESS=true
                  break
                else
                  echo "Could not connect to Neo4j using the driver"
                fi
              else
                echo "Neo4j Bolt port is not open yet"
              fi
              
              # Retry with backoff
              if [ $RETRY_COUNT -lt $((MAX_RETRIES - 1)) ]; then
                SLEEP_TIME=$((15 * (RETRY_COUNT + 1)))
                echo "Retrying in $SLEEP_TIME seconds..."
                sleep $SLEEP_TIME
              fi
              
              RETRY_COUNT=$((RETRY_COUNT + 1))
            done
            
            # Handle verification failure
            if [ "$SUCCESS" != "true" ]; then
              echo "Error: Neo4j connectivity verification failed on $SPACE_NAME after $MAX_RETRIES attempts"
              
              # Get instance ID directly from terraform outputs
              local INSTANCE_ID=""
              if [[ "$SPACE_NAME" == "LedgerSpace" ]]; then
                INSTANCE_ID=$(terraform output -raw neo4j_ledger_instance_id 2>/dev/null | grep -o "i-[a-z0-9]*" | head -n 1)
              else
                INSTANCE_ID=$(terraform output -raw neo4j_search_instance_id 2>/dev/null | grep -o "i-[a-z0-9]*" | head -n 1)
              fi
              
              if [ -z "$INSTANCE_ID" ]; then
                echo "Could not determine instance ID for $SPACE_NAME"
                return 1
              fi
              
              # Check instance status
              echo "Instance status for $INSTANCE_ID:"
              aws ec2 describe-instance-status --instance-ids "$INSTANCE_ID" --include-all-statuses --output json || echo "Could not get instance status"
              
              # Try to get console output
              echo "Console output for $INSTANCE_ID:"
              aws ec2 get-console-output --instance-id "$INSTANCE_ID" --output text | grep -A 10 "NEO4J_INSTALL_STATUS" || echo "No Neo4j status found in console output"
              
              # Try to get system log
              echo "Checking system log for Neo4j installation issues:"
              aws ec2 get-console-output --instance-id "$INSTANCE_ID" --output text | grep -i "neo4j\|error\|fail" || echo "No relevant log entries found"
              
              return 1
            fi
            
            echo "Neo4j connectivity verification successful on $SPACE_NAME"
            return 0
          }

          # Verify Neo4j connectivity on both instances
          if verify_neo4j_connectivity "$LEDGER_IP" "LedgerSpace"; then
            echo "LedgerSpace connectivity verification successful"
          else
            echo "LedgerSpace connectivity verification failed"
            exit 1
          fi
          
          if verify_neo4j_connectivity "$SEARCH_IP" "SearchSpace"; then
            echo "SearchSpace connectivity verification successful"
          else
            echo "SearchSpace connectivity verification failed"
            exit 1
          fi

          echo "Neo4j connectivity verified successfully on both instances"

      - name: Print Database Infrastructure Outputs
        run: |
          cd terraform
          echo "Retrieving database infrastructure outputs..."
          echo "========================================"
          echo "Database Infrastructure Outputs:"
          echo "========================================"

          # Get individual outputs directly and clean them
          LEDGER_ID=$(terraform output -raw neo4j_ledger_instance_id 2>/dev/null | grep -o "i-[a-z0-9]*" | head -n 1 | tr -d '\n' || echo "")
          LEDGER_IP=$(terraform output -raw neo4j_ledger_private_ip 2>/dev/null | head -n 1 | tr -d '\n' || echo "")
          LEDGER_BOLT=$(terraform output -raw neo4j_ledger_bolt_endpoint 2>/dev/null | head -n 1 | tr -d '\n' || echo "")
          
          SEARCH_ID=$(terraform output -raw neo4j_search_instance_id 2>/dev/null | grep -o "i-[a-z0-9]*" | head -n 1 | tr -d '\n' || echo "")
          SEARCH_IP=$(terraform output -raw neo4j_search_private_ip 2>/dev/null | head -n 1 | tr -d '\n' || echo "")
          SEARCH_BOLT=$(terraform output -raw neo4j_search_bolt_endpoint 2>/dev/null | head -n 1 | tr -d '\n' || echo "")

          # Print LedgerSpace details
          echo "Neo4j LedgerSpace Instance:"
          echo "  Instance ID: $LEDGER_ID"
          echo "  Private IP: $LEDGER_IP"
          echo "  Bolt URL: $LEDGER_BOLT"
          echo "  HTTP URL: http://$LEDGER_IP:7474"
          echo "  HTTPS URL: https://$LEDGER_IP:7473"

          echo ""
          echo "Neo4j SearchSpace Instance:"
          echo "  Instance ID: $SEARCH_ID"
          echo "  Private IP: $SEARCH_IP"
          echo "  Bolt URL: $SEARCH_BOLT"
          echo "  HTTP URL: http://$SEARCH_IP:7474"
          echo "  HTTPS URL: https://$SEARCH_IP:7473"

          echo "========================================"
          echo "Please save these values securely. You may need to manually set them as GitHub secrets or use them in your application configuration."
          echo "Remember to set up the following secrets:"
          echo "- NEO_4J_LEDGER_SPACE_BOLT_URL"
          echo "- NEO_4J_SEARCH_SPACE_BOLT_URL"
          echo "========================================"
