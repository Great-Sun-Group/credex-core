    <script>
      // API Specification
      const apiSpec = {
  "openapi": "3.0.0",
  "info": {
    "title": "Credex Core API",
    "version": "1.0.0",
    "description": "API documentation for the Credex Core system. This API provides endpoints for managing members, accounts, Credex transactions, and recurring payments."
  },
  "servers": [
    {
      "url": "http://localhost:3000",
      "description": "Development server"
    },
    {
      "url": "https://api.credex.example.com",
      "description": "Production server"
    },
    {
      "url": "https://staging-api.credex.example.com",
      "description": "Staging server"
    }
  ],
  "components": {
    "securitySchemes": {
      "bearerAuth": {
        "type": "http",
        "scheme": "bearer",
        "bearerFormat": "JWT"
      },
      "clientApiKey": {
        "type": "apiKey",
        "in": "header",
        "name": "x-client-api-key",
        "description": "Client API key for authentication"
      },
      "devAdminAuth": {
        "type": "apiKey",
        "in": "header",
        "name": "x-dev-admin-key",
        "description": "Development admin API key for authentication"
      }
    },
    "schemas": {
      "Error": {
        "type": "object",
        "properties": {
          "success": {
            "type": "boolean",
            "example": false
          },
          "message": {
            "type": "string",
            "description": "Error message"
          },
          "details": {
            "type": "string",
            "description": "Detailed error information"
          },
          "error": {
            "type": "string",
            "description": "Technical error details"
          }
        }
      },
      "ServiceHealth": {
        "type": "object",
        "properties": {
          "status": {
            "type": "string",
            "enum": [
              "healthy",
              "error"
            ],
            "description": "Service health status"
          },
          "message": {
            "type": "string",
            "description": "Health status message"
          },
          "details": {
            "type": "string",
            "description": "Additional health status details"
          }
        }
      },
      "FCMToken": {
        "type": "object",
        "required": [
          "token",
          "userId",
          "platform"
        ],
        "properties": {
          "token": {
            "type": "string",
            "description": "Firebase Cloud Messaging token"
          },
          "userId": {
            "type": "string",
            "description": "User ID associated with the token"
          },
          "platform": {
            "type": "string",
            "enum": [
              "ios",
              "android"
            ],
            "description": "Device platform"
          },
          "createdAt": {
            "type": "string",
            "format": "date-time",
            "description": "Token creation timestamp"
          },
          "updatedAt": {
            "type": "string",
            "format": "date-time",
            "description": "Token last update timestamp"
          }
        }
      },
      "NotificationResponse": {
        "type": "object",
        "required": [
          "success"
        ],
        "properties": {
          "success": {
            "type": "boolean",
            "description": "Operation success status"
          },
          "message": {
            "type": "string",
            "description": "Response message"
          },
          "error": {
            "type": "string",
            "description": "Error message if operation failed"
          },
          "details": {
            "type": "string",
            "description": "Additional error or success details"
          },
          "isValid": {
            "type": "boolean",
            "description": "Token validation result (for validate-token endpoint)"
          }
        }
      },
      "NotificationType": {
        "type": "string",
        "enum": [
          "OFFER_CREATED",
          "OFFER_CANCELLED",
          "OFFER_ACCEPTED",
          "OFFER_DECLINED",
          "CREDLOOP_COMPLETED"
        ],
        "description": "Type of notification event"
      },
      "NotificationData": {
        "type": "object",
        "required": [
          "type",
          "recipientID",
          "data"
        ],
        "properties": {
          "type": {
            "$ref": "#/components/schemas/NotificationType"
          },
          "recipientID": {
            "type": "string",
            "description": "ID of the notification recipient"
          },
          "data": {
            "type": "object",
            "required": [
              "credexID"
            ],
            "properties": {
              "credexID": {
                "type": "string",
                "description": "ID of the related Credex transaction"
              },
              "amount": {
                "type": "string",
                "description": "Transaction amount"
              },
              "denomination": {
                "type": "string",
                "description": "Currency denomination"
              },
              "counterpartyName": {
                "type": "string",
                "description": "Name of the counterparty"
              },
              "clearedPayable": {
                "type": "object",
                "properties": {
                  "amount": {
                    "type": "string"
                  },
                  "denomination": {
                    "type": "string"
                  },
                  "owedTo": {
                    "type": "string"
                  }
                }
              },
              "clearedReceivable": {
                "type": "object",
                "properties": {
                  "amount": {
                    "type": "string"
                  },
                  "denomination": {
                    "type": "string"
                  },
                  "owedFrom": {
                    "type": "string"
                  }
                }
              }
            }
          }
        }
      },
      "DevAdminAction": {
        "type": "object",
        "required": [
          "id",
          "type",
          "timestamp",
          "actor",
          "details"
        ],
        "properties": {
          "id": {
            "type": "string",
            "nullable": true,
            "description": "Resource identifier"
          },
          "type": {
            "type": "string",
            "description": "Type of action performed"
          },
          "timestamp": {
            "type": "string",
            "format": "date-time",
            "description": "When the action occurred"
          },
          "actor": {
            "type": "string",
            "description": "Who performed the action"
          },
          "details": {
            "type": "object",
            "description": "Action-specific details"
          }

      },
      "DevAdminResponse": {
        "type": "object",
        "required": [
          "message",
          "data"
        ],
        "properties": {
          "message": {
            "type": "string",
            "description": "Human-friendly message"
          },
          "data": {
            "type": "object",
            "required": [
              "action",
              "dashboard"
            ],
            "properties": {
              "action": {
                "$ref": "#/components/schemas/DevAdminAction"
              },
              "dashboard": {
                "type": "object",
                "description": "Current system state"
              }
            }
          }
        }
      },
      "DevAdminError": {
        "type": "object",
        "required": [
          "message",
          "data"
        ],
        "properties": {
          "message": {
            "type": "string",
            "description": "Human-friendly error message"
          },
          "data": {
            "type": "object",
            "required": [
              "action",
              "dashboard"
            ],
            "properties": {
              "action": {
                "$ref": "#/components/schemas/DevAdminAction"
              },
              "dashboard": {
                "type": "object",
                "description": "Current system state"
              }
            }
          }
        }
      }
    }
  },
  "security": [
    {
      "bearerAuth": []
    }
  ],
  "tags": [
    {
      "name": "Members",
      "description": "Member management operations"
    },
    {
      "name": "Accounts",

    {
      "name": "App",

      "name": "Invoice",
      "description": "Invoice operations for managing transactions in the Vimbiso Market"
    }

  "paths": {
    "/createAccount": {
      "post": {
        "tags": [
          "Accounts"
        ],
        "summary": "Create a new account",
        "description": "Creates a new account for a member with optional DCO participation settings",
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "required": [
                  "accountType",
                  "accountName",
                  "accountHandle",
                  "defaultDenom"
                ],
                "properties": {
                  "accountType": {
                    "type": "string",
                    "enum": [
                      "PERSONAL",
                      "TRUST",
                      "OPERATIONS"
                    ],
                    "description": "Type of account to create"
                  },
                  "accountName": {
                    "type": "string",
                    "minLength": 3,
                    "maxLength": 50,
                    "description": "Name of the account"
                  },
                  "accountHandle": {
                    "type": "string",
                    "pattern": "^[a-z0-9_]{3,30}$",
                    "description": "Unique handle for the account (lowercase letters, numbers, underscores)"
                  },
                  "defaultDenom": {
                    "type": "string",
                    "enum": [
                      "CXX",
                      "CAD",
                      "USD",
                      "XAU"
                    ],
                    "description": "Default denomination for transactions"
                  },
                  "DCOgiveInCXX": {
                    "type": "number",
                    "minimum": 0,
                    "exclusiveMinimum": true,
                    "description": "Optional DCO give rate in CXX"
                  },
                  "DCOdenom": {
                    "type": "string",
                    "enum": [
                      "CXX",
                      "CAD",
                      "USD",
                      "XAU"
                    ],
                    "description": "Optional DCO denomination"
                  }
                }
              }
            }
          }
        },
        "responses": {
          "201": {
            "description": "Account created successfully",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "message": {
                      "type": "string",
                      "example": "Account \"Business Account\" created successfully with default denomination USD"
                    },
                    "data": {
                      "type": "object",
                      "properties": {
                        "action": {
                          "type": "object",
                          "properties": {
                            "id": {
                              "type": "string",
                              "format": "uuid",
                              "description": "The created account ID"
                            },
                            "type": {
                              "type": "string",
                              "enum": [
                                "ACCOUNT_CREATED"
                              ],
                              "description": "The type of action performed"
                            },
                            "timestamp": {
                              "type": "string",
                              "format": "date-time",
                              "description": "When the action occurred"
                            },
                            "actor": {
                              "type": "string",
                              "format": "uuid",
                              "description": "ID of the member who created the account"
                            },
                            "details": {
                              "type": "object",
                              "properties": {
                                "accountID": {
                                  "type": "string",
                                  "format": "uuid"
                                },
                                "accountName": {
                                  "type": "string"
                                },
                                "accountHandle": {
                                  "type": "string"
                                },
                                "defaultDenom": {
                                  "type": "string"
                                },
                                "ownerID": {
                                  "type": "string",
                                  "format": "uuid"
                                }
                              }
                            }
                          }
                        },
                        "dashboard": {
                          "type": "object",
                          "description": "Current state of the account dashboard",
                          "properties": {
                            "accountID": {
                              "type": "string",
                              "format": "uuid"
                            },
                            "accountName": {
                              "type": "string"
                            },
                            "accountHandle": {
                              "type": "string"
                            },
                            "accountType": {
                              "type": "string",
                              "enum": [
                                "PERSONAL",
                                "TRUST",
                                "OPERATIONS"
                              ],
                              "description": "Type of the account"
                            },
                            "defaultDenom": {
                              "type": "string"
                            },
                            "balanceData": {
                              "type": "object",
                              "description": "Initial balance data for the account"
                            },
                            "pendingInData": {
                              "type": "array",
                              "description": "Pending incoming transactions",
                              "items": {
                                "type": "object"
                              }
                            },
                            "pendingOutData": {
                              "type": "array",
                              "description": "Pending outgoing transactions",
                              "items": {
                                "type": "object"
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }
            }
          },
          "400": {
            "description": "Invalid input data",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "message": {
                      "type": "string",
                      "example": "Invalid denomination USD"
                    },
                    "data": {
                      "type": "object",
                      "properties": {
                        "action": {
                          "type": "object",
                          "properties": {
                            "id": {
                              "type": "string",
                              "nullable": true
                            },
                            "type": {
                              "type": "string",
                              "enum": [
                                "ERROR_VALIDATION"
                              ]
                            },
                            "timestamp": {
                              "type": "string",
                              "format": "date-time"
                            },
                            "actor": {
                              "type": "string",
                              "format": "uuid"
                            },
                            "details": {
                              "type": "object",
                              "properties": {
                                "code": {
                                  "type": "string",
                                  "example": "INVALID_DENOMINATION"
                                },
                                "reason": {
                                  "type": "string"
                                },
                                "field": {
                                  "type": "string"
                                }
                              }
                            }
                          }
                        },
                        "dashboard": {
                          "type": "object",
                          "description": "Empty dashboard object"
                        }
                      }
                    }
                  }
                }
              }
            }
          },
          "401": {
            "description": "Authentication required",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "message": {
                      "type": "string",
                      "example": "Authentication required"
                    },
                    "data": {
                      "type": "object",
                      "properties": {
                        "action": {
                          "type": "object",
                          "properties": {
                            "id": {
                              "type": "string",
                              "nullable": true
                            },
                            "type": {
                              "type": "string",
                              "enum": [
                                "ERROR_UNAUTHORIZED"
                              ]
                            },
                            "timestamp": {
                              "type": "string",
                              "format": "date-time"
                            },
                            "actor": {
                              "type": "string",
                              "example": "system"
                            },
                            "details": {
                              "type": "object",
                              "properties": {
                                "code": {
                                  "type": "string",
                                  "example": "NO_AUTH"
                                },
                                "reason": {
                                  "type": "string"
                                }
                              }
                            }
                          }
                        },
                        "dashboard": {
                          "type": "object",
                          "description": "Empty dashboard object"
                        }
                      }
                    }
                  }
                }
              }
            }
          },
          "403": {
            "description": "Account creation not permitted on current membership tier",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "message": {
                      "type": "string",
                      "example": "Account creation not permitted on current membership tier"
                    },
                    "data": {
                      "type": "object",
                      "properties": {
                        "action": {
                          "type": "object",
                          "properties": {
                            "id": {
                              "type": "string",
                              "nullable": true
                            },
                            "type": {
                              "type": "string",
                              "enum": [
                                "ERROR_UNAUTHORIZED"
                              ]
                            },
                            "timestamp": {
                              "type": "string",
                              "format": "date-time"
                            },
                            "actor": {
                              "type": "string",
                              "format": "uuid"
                            },
                            "details": {
                              "type": "object",
                              "properties": {
                                "code": {
                                  "type": "string",
                                  "example": "TIER_LIMIT_EXCEEDED"
                                },
                                "reason": {
                                  "type": "string"
                                },
                                "suggestion": {
                                  "type": "string"
                                }
                              }
                            }
                          }
                        },
                        "dashboard": {
                          "type": "object",
                          "description": "Empty dashboard object"
                        }
                      }
                    }
                  }
                }
              }
            }
          },
          "404": {
            "description": "Member not found",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "message": {
                      "type": "string",
                      "example": "Member not found"
                    },
                    "data": {
                      "type": "object",
                      "properties": {
                        "action": {
                          "type": "object",
                          "properties": {
                            "id": {
                              "type": "string",
                              "nullable": true
                            },
                            "type": {
                              "type": "string",
                              "enum": [
                                "ERROR_NOT_FOUND"
                              ]
                            },
                            "timestamp": {
                              "type": "string",
                              "format": "date-time"
                            },
                            "actor": {
                              "type": "string",
                              "format": "uuid"
                            },
                            "details": {
                              "type": "object",
                              "properties": {
                                "code": {
                                  "type": "string",
                                  "example": "MEMBER_NOT_FOUND"
                                },
                                "reason": {
                                  "type": "string"
                                }
                              }
                            }
                          }
                        },
                        "dashboard": {
                          "type": "object",
                          "description": "Empty dashboard object"
                        }
                      }
                    }
                  }
                }

          "500": {
            "description": "Internal server error",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "message": {
                      "type": "string",

                    },

                      "type": "object",
                      "properties": {
                        "action": {

                            },
                            "type": {
                              "type": "string",
                              "enum": [
                                "ERROR_INTERNAL"
                              ]
                            },

                              "type": "string",

    "/createTrustAccount": {
      "post": {
        "summary": "Create a new trust account",
        "description": "Creates a new trust account with BANK or VAULT subtype. Only available to tier 5 members.",
        "tags": [
          "Accounts"
        ],
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "required": [
                  "accountName",
                  "accountHandle",
                  "subtype",
                  "denomination"
                ],
                "properties": {
                  "accountName": {
                    "type": "string",
                    "description": "Name of the trust account"
                  },
                  "accountHandle": {
                    "type": "string",
                    "description": "Unique handle for the account"
                  },
                  "subtype": {
                    "type": "string",
                    "enum": [
                      "BANK",
                      "VAULT"
                    ],
                    "description": "Type of trust account"
                  },
                  "denomination": {
                    "type": "string",
                    "description": "Account denomination"
                  },
                  "bankFields": {
                    "type": "object",
                    "description": "Required for BANK subtype. Contains jurisdiction-specific bank details.",
                    "properties": {
                      "jurisdiction": {
                        "type": "string",
                        "description": "Country code (e.g., CA, US, ZW)"
                      }
                    }
                  }
                }
              }
            }
          }
        },
        "responses": {
          "201": {
            "description": "Trust account created successfully",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "message": {
                      "type": "string",
                      "description": "Success message"
                    },
                    "data": {
                      "type": "object",
                      "properties": {
                        "action": {
                          "type": "object",
                          "properties": {
                            "id": {
                              "type": "string",
                              "format": "uuid",
                              "description": "The accountID of the created trust account"
                            },
                            "type": {
                              "type": "string",
                              "enum": [
                                "TRUST_ACCOUNT_CREATED"
                              ],
                              "description": "Business action type"
                            },
                            "timestamp": {
                              "type": "string",
                              "format": "date-time",
                              "description": "When the action occurred"
                            },
                            "actor": {
                              "type": "string",
                              "format": "uuid",
                              "description": "MemberID who performed the action"
                            },
                            "details": {
                              "type": "object",
                              "properties": {
                                "accountID": {
                                  "type": "string",
                                  "format": "uuid"
                                },
                                "accountHandle": {
                                  "type": "string"
                                },
                                "subtype": {
                                  "type": "string",
                                  "enum": [
                                    "BANK",
                                    "VAULT"
                                  ]
                                },
                                "denomination": {
                                  "type": "string"
                                }
                              }
                            }
                          }
                        },
                        "dashboard": {
                          "type": "object",
                          "description": "Full dashboard state after the action",
                          "properties": {
                            "member": {
                              "type": "object",
                              "description": "Member-level dashboard data",
                              "properties": {
                                "memberID": {
                                  "type": "string",
                                  "format": "uuid",
                                  "description": "ID of the authenticated member"
                                },

    "/generateInvoice": {
      "post": {
        "tags": [
          "Invoice"
        ],
        "summary": "Generate an invoice for a transaction",
        "description": "Generate an invoice for a transaction with multiple line items.\nThe invoice creates a DEBITS_TO relationship to the payment account and\nCREDITS_TO relationships to each AccountInternal specified in the items array.\n",
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {

                "type": "object",
                "required": [
                  "paymentAccountID",
                  "InvoiceData"
                ],
                "properties": {
                  "paymentAccountID": {
                    "type": "string",
                    "format": "uuid",
                    "description": "ID of the account to debit payment from (DEBITS_TO relationship)"
                  },

                    "type": "object",
                    "required": [
                      "items",
                      "total",
                      "denomination"
                    ],
                    "properties": {
                      "items": {
                        "type": "array",
                        "description": "Array of items to credit payment to (CREDITS_TO relationships)",
                        "items": {
                          "type": "object",
                          "required": [
                            "accountID",
                            "amount"
                          ],
                          "properties": {
                            "accountID": {
                              "type": "string",
                              "format": "uuid",
                              "description": "ID of the AccountInternal to credit"
                            },
                            "amount": {
                              "type": "number",
                              "description": "Amount to credit to this account"

                      },
                      "total": {
                        "type": "number",
                        "description": "Total amount for the invoice (sum of all item amounts)"

                      "denomination": {
                        "type": "string",
                        "enum": [
                          "USD",
                          "CAD",
                          "CXX",
                          "XAU"
                        ],
                        "description": "Denomination for the invoice"
                      },
                      "notes": {
                        "type": "string",
                        "description": "Additional notes for the invoice"
                      }
                    }
                  }
                }
              }

    "/onboardMember": {
      "post": {

        ],
        "summary": "Onboard a new member",
        "description": "Creates a new member account with default tier 1 and associated personal account.\nThe process includes:\n- Creating member with initial tier 1 status\n- Creating personal account with specified denomination\n- Generating authentication token\n- Retrieving initial dashboard state\n",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",

                  "firstname",
                  "lastname",
                  "phone",
                  "defaultDenom"
                ],
                "properties": {
                  "firstname": {
                    "type": "string",
                    "minLength": 3,
                    "maxLength": 50,
                    "description": "Member's first name"

                  "lastname": {
                    "type": "string",
                    "minLength": 3,
                    "maxLength": 50,
                    "description": "Member's last name"

                    "type": "string",
                    "pattern": "^[1-9]\\d{1,14}$",
                    "description": "International phone number format (digits only, no + prefix)"

                  "defaultDenom": {
                    "type": "string",

                      "CXX",

                      "XAU"

      // Module order
      const moduleOrder = ['Member', 'Account', 'Credex', 'AccountInternal', 'AssetMarker', 'Recurring', 'Invoice', 'Admin', 'DevAdmin'];

      function escapeHtml(unsafe) {
        return unsafe
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      function getModuleForPath(path) {
        // Use the tags from the swagger spec to determine the module
        const pathObj = apiSpec.paths[path];
        if (!pathObj) return 'Other';
        
        // Get the first method (e.g. post, get, etc)
        const method = Object.values(pathObj)[0];
        if (!method || !method.tags || !method.tags.length) return 'Other';
        
        // Get the first tag
        const tag = method.tags[0];
        
        // Map tags to modules
        const tagToModule = {
          'Members': 'Member',
          'Accounts': 'Account',
          'Credex': 'Credex',
          'AccountInternal': 'AccountInternal',
          'AssetMarker': 'AssetMarker',
          'Recurring': 'Recurring',
          'Invoice': 'Invoice',
          'Admin': 'Admin',
          'DevAdmin': 'DevAdmin'
        };
        
        return tagToModule[tag] || 'Other';
      }

      function generateNavigation() {
        const sidebar = document.getElementById('sidebar');
        const paths = Object.keys(apiSpec.paths).sort();
        
        // Group paths by module
        const moduleGroups = {};
        paths.forEach(path => {
          const module = getModuleForPath(path);
          if (!moduleGroups[module]) {
            moduleGroups[module] = [];
          }
          moduleGroups[module].push(path);
        });

        // Generate HTML for each module section
        const navHtml = moduleOrder.map(module => {
          if (!moduleGroups[module]) return '';
          
          const pathsHtml = moduleGroups[module].map(path => {
            const id = path.replace(/[^a-zA-Z0-9]/g, '_');
            return `
              <div class="nav-item">
                <a href="#${id}" class="nav-link" data-path="${path}">${path}</a>
              </div>
            `;
          }).join('');

          return `
            <div class="module-section">
              <div class="module-title">${module}</div>
              ${pathsHtml}
            </div>
          `;
        }).join('');
        
        sidebar.innerHTML = navHtml;
      }

      function generateEndpointDocs(path) {
        const methods = apiSpec.paths[path];
        return Object.entries(methods).map(([method, details]) => {
          const responses = Object.entries(details.responses || {}).map(([code, response]) => {
            const className = code.startsWith('2') ? 'success' : 
                            code.startsWith('4') ? 'error' : 'warning';
            return `
              <div class="response ${className}">
                <div class="section-title">Status ${code}: ${response.description}</div>
                <pre><code>${escapeHtml(JSON.stringify(response.content?.['application/json']?.schema || {}, null, 2))}</code></pre>
              </div>
            `;
          }).join('');

          const parameters = details.parameters ? `
            <div class="section">
              <div class="section-title">Parameters</div>
              <pre><code>${escapeHtml(JSON.stringify(details.parameters, null, 2))}</code></pre>
            </div>
          ` : '';

          const requestBody = details.requestBody ? `
            <div class="section">
              <div class="section-title">Request Body</div>
              <pre><code>${escapeHtml(JSON.stringify(details.requestBody.content?.['application/json']?.schema || {}, null, 2))}</code></pre>
            </div>
          ` : '';

          return `
            <div class="endpoint" id="${path.replace(/[^a-zA-Z0-9]/g, '_')}">
              <div class="endpoint-header">
                <span class="method ${method.toLowerCase()}">${method.toUpperCase()}</span>
                <span class="path">${path}</span>
              </div>
              <div class="description">${details.description || details.summary || ''}</div>
              ${parameters}
              ${requestBody}
              <div class="section">
                <div class="section-title">Responses</div>
                ${responses}
              </div>
            </div>
          `;
        }).join('');
      }

      // Handle navigation
      document.addEventListener('click', (e) => {
        if (e.target.classList.contains('nav-link')) {
          e.preventDefault();
          const links = document.querySelectorAll('.nav-link');
          links.forEach(link => link.classList.remove('active'));
          e.target.classList.add('active');
          
          const path = e.target.getAttribute('data-path');
          const endpointContent = document.getElementById('endpoint-content');
          endpointContent.innerHTML = generateEndpointDocs(path);
          
          // Update URL hash without scrolling
          history.pushState(null, null, e.target.getAttribute('href'));
        }
      });

      // Initialize documentation
      document.addEventListener('DOMContentLoaded', () => {
        try {
          generateNavigation();
          
          // Load initial endpoint if hash exists
          const hash = window.location.hash.substring(1);
          if (hash) {
            const link = document.querySelector(`[href="#${hash}"]`);
            if (link) {
              link.classList.add('active');
              const path = link.getAttribute('data-path');
              document.getElementById('endpoint-content').innerHTML = generateEndpointDocs(path);
            }
          }
        } catch (err) {
          console.error('Failed to generate documentation:', err);
          document.getElementById('endpoint-content').innerHTML = 
            '<p style="color: red; padding: 1rem;">Error generating documentation: ' + err.message + '</p>';
        }
      });

      // Handle hash changes
      window.addEventListener('hashchange', () => {
        const links = document.querySelectorAll('.nav-link');
        links.forEach(link => link.classList.remove('active'));
        const hash = window.location.hash;
        if (hash) {
          const activeLink = document.querySelector(`[href="${hash}"]`);
          if (activeLink) {
            activeLink.classList.add('active');
            const path = activeLink.getAttribute('data-path');
            document.getElementById('endpoint-content').innerHTML = generateEndpointDocs(path);
          }
        }
      });
    </script>
