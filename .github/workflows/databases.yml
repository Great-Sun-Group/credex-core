name: Deploy Databases

on:
  push:
    branches:
      - "*deploy*"
  workflow_dispatch:

jobs:
  deploy_neo4j:
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/prod' && 'production' || github.ref == 'refs/heads/stage' && 'staging' || 'development' }}

    env:
      ENVIRONMENT: ${{ github.ref == 'refs/heads/prod' && 'production' || github.ref == 'refs/heads/stage' && 'staging' || 'development' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.CREDEXCORE_DEV_AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.CREDEXCORE_DEV_AWS_SECRET_ACCESS_KEY }}
          aws-region: af-south-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Setup and Initialize Terraform Backend
        run: |
          echo "Current environment: ${ENVIRONMENT}"

          # Initialize Terraform
          cd terraform
          echo "Initializing Terraform..."
          terraform init \
            -backend-config="bucket=credex-terraform-state-${ENVIRONMENT}" \
            -backend-config="key=terraform.tfstate" \
            -backend-config="region=af-south-1" \
            -backend-config="dynamodb_table=credex-terraform-state-lock-${ENVIRONMENT}"

      - name: Terraform Plan
        env:
          TF_VAR_environment: ${{ env.ENVIRONMENT }}
          TF_VAR_neo4j_enterprise_license: ${{ secrets.NEO4J_ENTERPRISE_LICENSE }}
          # Add dummy values for required variables since they're not used by the databases module
          TF_VAR_jwt_secret: "dummy"
          TF_VAR_client_api_key: "dummy"
          TF_VAR_dev_admin_key: "dummy"
          TF_VAR_skip_rate_limiter_key: "dummy"
          TF_VAR_open_exchange_rates_api: "dummy"
          # Add dummy values for Neo4j connection details that will be replaced with real values after deployment
          TF_VAR_neo_4j_ledger_space_bolt_url: "bolt://dummy-ledger:7687"
          TF_VAR_neo_4j_search_space_bolt_url: "bolt://dummy-search:7687"
          TF_VAR_neo_4j_ledger_space_user: "neo4j"
          TF_VAR_neo_4j_search_space_user: "neo4j"
          TF_VAR_neo_4j_ledger_space_password: "dummy-password"
          TF_VAR_neo_4j_search_space_password: "dummy-password"
          # Add dummy values for Firebase variables since they're not used by the databases module
          TF_VAR_firebase_project_id: "dummy"
          TF_VAR_firebase_client_email: "dummy@project.iam.gserviceaccount.com"
          TF_VAR_firebase_private_key: "dummy-private-key"
        run: |
          cd terraform
          echo "Current environment: ${ENVIRONMENT}"
          echo "Planning Terraform changes..."
          terraform plan -input=false -out=tfplan -target=module.databases -replace="module.databases.aws_instance.neo4j_ledger" -replace="module.databases.aws_instance.neo4j_search"

      - name: Terraform Apply
        env:
          TF_VAR_environment: ${{ env.ENVIRONMENT }}
          TF_VAR_neo4j_enterprise_license: ${{ secrets.NEO4J_ENTERPRISE_LICENSE }}
          # Add dummy values for required variables since they're not used by the databases module
          TF_VAR_jwt_secret: "dummy"
          TF_VAR_client_api_key: "dummy"
          TF_VAR_dev_admin_key: "dummy"
          TF_VAR_skip_rate_limiter_key: "dummy"
          TF_VAR_open_exchange_rates_api: "dummy"
          # Add dummy values for Neo4j connection details that will be replaced with real values after deployment
          TF_VAR_neo_4j_ledger_space_bolt_url: "bolt://dummy-ledger:7687"
          TF_VAR_neo_4j_search_space_bolt_url: "bolt://dummy-search:7687"
          TF_VAR_neo_4j_ledger_space_user: "neo4j"
          TF_VAR_neo_4j_search_space_user: "neo4j"
          TF_VAR_neo_4j_ledger_space_password: "dummy-password"
          TF_VAR_neo_4j_search_space_password: "dummy-password"
          # Add dummy values for Firebase variables since they're not used by the databases module
          TF_VAR_firebase_project_id: "dummy"
          TF_VAR_firebase_client_email: "dummy@project.iam.gserviceaccount.com"
          TF_VAR_firebase_private_key: "dummy-private-key"
        run: |
          cd terraform
          echo "Current environment: ${ENVIRONMENT}"
          echo "Applying Terraform changes..."

          if ! terraform apply -auto-approve -input=false tfplan; then
            echo "Error: Terraform apply failed"
            echo "Checking terraform logs for details..."
            terraform show tfplan
            exit 1
          fi

          echo "Terraform apply completed successfully"

      - name: Wait for Neo4j Instances
        run: |
          cd terraform
          echo "Waiting for Neo4j instances to be ready..."

          # Get instance IDs and clean output
          LEDGER_ID=$(terraform output -raw neo4j_ledger_instance_id | tr -d '\n' | grep -o 'i-[a-z0-9]\{17\}')
          SEARCH_ID=$(terraform output -raw neo4j_search_instance_id | tr -d '\n' | grep -o 'i-[a-z0-9]\{17\}')

          # Verify IDs are valid
          if [[ ! "$LEDGER_ID" =~ ^i-[a-z0-9]{17}$ ]] || [[ ! "$SEARCH_ID" =~ ^i-[a-z0-9]{17}$ ]]; then
            echo "Error: Invalid instance IDs"
            echo "LEDGER_ID: $LEDGER_ID"
            echo "SEARCH_ID: $SEARCH_ID"
            exit 1
          fi

          echo "Waiting for instances to be ready..."
          aws ec2 wait instance-status-ok --instance-ids "$LEDGER_ID" "$SEARCH_ID"

          echo "Neo4j instances are ready"

      - name: Print Infrastructure Status
        run: |
          cd terraform
          echo "Database Infrastructure Outputs:"
          echo "========================================"

          # Get clean outputs
          LEDGER_ID=$(terraform output -raw neo4j_ledger_instance_id | tr -d '\n' | grep -o 'i-[a-z0-9]\{17\}')
          LEDGER_IP=$(terraform output -raw neo4j_ledger_private_ip | tr -d '\n')
          SEARCH_ID=$(terraform output -raw neo4j_search_instance_id | tr -d '\n' | grep -o 'i-[a-z0-9]\{17\}')
          SEARCH_IP=$(terraform output -raw neo4j_search_private_ip | tr -d '\n')

          echo "Neo4j LedgerSpace Instance:"
          echo "  Instance ID: $LEDGER_ID"
          echo "  Private IP: $LEDGER_IP"
          echo ""
          echo "Neo4j SearchSpace Instance:"
          echo "  Instance ID: $SEARCH_ID"
          echo "  Private IP: $SEARCH_IP"
          echo ""
          echo "Note: Neo4j instances are in private subnets and require VPC access."
