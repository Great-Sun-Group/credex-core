name: Deploy Databases

on:
  push:
    branches:
      - "*deploy*"
  workflow_dispatch:

jobs:
  deploy_neo4j:
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/prod' && 'production' || github.ref == 'refs/heads/stage' && 'staging' || 'development' }}

    env:
      ENVIRONMENT: ${{ github.ref == 'refs/heads/prod' && 'production' || github.ref == 'refs/heads/stage' && 'staging' || 'development' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: af-south-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Setup and Initialize Terraform Backend
        run: |
          echo "Current environment: ${ENVIRONMENT}"

          # Initialize Terraform
          cd terraform
          echo "Initializing Terraform..."
          terraform init \
            -backend-config="bucket=credex-terraform-state-${ENVIRONMENT}" \
            -backend-config="key=terraform.tfstate" \
            -backend-config="region=af-south-1" \
            -backend-config="dynamodb_table=credex-terraform-state-lock-${ENVIRONMENT}"

      - name: Terraform Plan
        env:
          TF_VAR_environment: ${{ env.ENVIRONMENT }}
          TF_VAR_neo4j_enterprise_license: ${{ secrets.NEO4J_ENTERPRISE_LICENSE }}
          # Add dummy values for required variables since they're not used by the databases module
          TF_VAR_jwt_secret: "dummy"
          TF_VAR_client_api_key: "dummy"
          TF_VAR_dev_admin_key: "dummy"
          TF_VAR_skip_rate_limiter_key: "dummy"
          TF_VAR_open_exchange_rates_api: "dummy"
          # Add dummy values for Neo4j connection details that will be replaced with real values after deployment
          TF_VAR_neo_4j_ledger_space_bolt_url: "bolt://dummy-ledger:7687"
          TF_VAR_neo_4j_search_space_bolt_url: "bolt://dummy-search:7687"
          TF_VAR_neo_4j_ledger_space_user: "neo4j"
          TF_VAR_neo_4j_search_space_user: "neo4j"
          TF_VAR_neo_4j_ledger_space_password: "dummy-password"
          TF_VAR_neo_4j_search_space_password: "dummy-password"
          # Add dummy values for Firebase variables since they're not used by the databases module
          TF_VAR_firebase_project_id: "dummy"
          TF_VAR_firebase_client_email: "dummy@project.iam.gserviceaccount.com"
          TF_VAR_firebase_private_key: "dummy-private-key"
        run: |
          cd terraform
          echo "Current environment: ${ENVIRONMENT}"
          echo "Planning Terraform changes..."
          terraform plan -input=false -out=tfplan -target=module.databases -replace="module.databases.aws_instance.neo4j_ledger" -replace="module.databases.aws_instance.neo4j_search"

      - name: Terraform Apply
        env:
          TF_VAR_environment: ${{ env.ENVIRONMENT }}
          TF_VAR_neo4j_enterprise_license: ${{ secrets.NEO4J_ENTERPRISE_LICENSE }}
          # Add dummy values for required variables since they're not used by the databases module
          TF_VAR_jwt_secret: "dummy"
          TF_VAR_client_api_key: "dummy"
          TF_VAR_dev_admin_key: "dummy"
          TF_VAR_skip_rate_limiter_key: "dummy"
          TF_VAR_open_exchange_rates_api: "dummy"
          # Add dummy values for Neo4j connection details that will be replaced with real values after deployment
          TF_VAR_neo_4j_ledger_space_bolt_url: "bolt://dummy-ledger:7687"
          TF_VAR_neo_4j_search_space_bolt_url: "bolt://dummy-search:7687"
          TF_VAR_neo_4j_ledger_space_user: "neo4j"
          TF_VAR_neo_4j_search_space_user: "neo4j"
          TF_VAR_neo_4j_ledger_space_password: "dummy-password"
          TF_VAR_neo_4j_search_space_password: "dummy-password"
          # Add dummy values for Firebase variables since they're not used by the databases module
          TF_VAR_firebase_project_id: "dummy"
          TF_VAR_firebase_client_email: "dummy@project.iam.gserviceaccount.com"
          TF_VAR_firebase_private_key: "dummy-private-key"
        run: |
          cd terraform
          echo "Current environment: ${ENVIRONMENT}"
          echo "Applying Terraform changes..."
          
          if ! terraform apply -auto-approve -input=false tfplan; then
            echo "Error: Terraform apply failed"
            echo "Checking terraform logs for details..."
            terraform show tfplan
            exit 1
          fi

          echo "Terraform apply completed successfully"
          
          echo "Waiting for resources to be created..."
          # EC2 instances take time to initialize, especially with user_data script
          # Wait up to 5 minutes checking every 30 seconds
          for i in {1..10}; do
            echo "Checking terraform outputs (attempt $i/10)..."
            # Get instance IDs and clean them
            LEDGER_ID=$(terraform output -raw neo4j_ledger_instance_id 2>/dev/null | grep -o "i-[a-z0-9]*" | head -n1 || echo "")
            SEARCH_ID=$(terraform output -raw neo4j_search_instance_id 2>/dev/null | grep -o "i-[a-z0-9]*" | head -n1 || echo "")
            
            if [ -n "$LEDGER_ID" ] && [ -n "$SEARCH_ID" ]; then
              echo "Found both instance IDs:"
              echo "  LedgerSpace: $LEDGER_ID"
              echo "  SearchSpace: $SEARCH_ID"
              break
            fi
            
            if [ $i -eq 10 ]; then
              echo "Error: Timed out waiting for terraform outputs"
              exit 1
            fi
            
            echo "Waiting 30 seconds before next check..."
            sleep 30
          done

      - name: Verify Neo4j Deployments
        run: |
          cd terraform
          echo "Verifying Neo4j deployments..."

          # Install netcat for port checking
          sudo apt-get update
          sudo apt-get install -y netcat-openbsd

          # Get instance IDs and clean them
          LEDGER_ID=$(terraform output -raw neo4j_ledger_instance_id 2>/dev/null | grep -o "i-[a-z0-9]*" | head -n1 || echo "")
          SEARCH_ID=$(terraform output -raw neo4j_search_instance_id 2>/dev/null | grep -o "i-[a-z0-9]*" | head -n1 || echo "")

          if [ -z "$LEDGER_ID" ] || [ -z "$SEARCH_ID" ]; then
            echo "Error: Could not get Neo4j instance IDs"
            exit 1
          fi

          # Function to verify instance
          verify_instance() {
            # Clean extraction of instance ID, removing any debug output
            local INSTANCE_ID=$(echo "$1" | grep -o "i-[a-z0-9]*" | head -n1)
            local SPACE_NAME=$2
            
            if [ -z "$INSTANCE_ID" ]; then
              echo "Error: Could not extract valid instance ID from: $1"
              exit 1
            fi
            
            echo "Verifying $SPACE_NAME instance ($INSTANCE_ID)..."
            
            # Wait for instance to be running
            echo "Waiting for instance to be running..."
            aws ec2 wait instance-running --instance-ids "$INSTANCE_ID"
            
            # Wait for status checks
            echo "Waiting for status checks to pass..."
            aws ec2 wait instance-status-ok --instance-ids "$INSTANCE_ID"
            
            # Get instance details
            PRIVATE_IP=$(aws ec2 describe-instances \
              --instance-ids "$INSTANCE_ID" \
              --query 'Reservations[0].Instances[0].PrivateIpAddress' \
              --output text)
            
            if [ -z "$PRIVATE_IP" ]; then
              echo "Error: Could not get private IP for instance $INSTANCE_ID"
              exit 1
            fi
            
            echo "$SPACE_NAME instance is running:"
            echo "Instance ID: $INSTANCE_ID"
            echo "Private IP: $PRIVATE_IP"
            
            # Verify instance system status
            echo "Checking instance system status..."
            aws ec2 describe-instance-status \
              --instance-ids "$INSTANCE_ID" \
              --query 'InstanceStatuses[0].{SystemStatus:SystemStatus.Status,InstanceStatus:InstanceStatus.Status}' \
              --output table

            # Wait for Neo4j to be ready
            echo "Waiting for Neo4j to be ready..."
            for i in {1..20}; do
              BOLT_READY=false
              HTTP_READY=false
              HTTPS_READY=false

              # Check Bolt port (suppress netcat output)
              if nc -z "$PRIVATE_IP" 7687 >/dev/null 2>&1; then
                echo "Neo4j is accepting connections on Bolt port (7687)"
                BOLT_READY=true
              fi

              # Check HTTP port (suppress netcat output)
              if nc -z "$PRIVATE_IP" 7474 >/dev/null 2>&1; then
                echo "Neo4j is accepting connections on HTTP port (7474)"
                HTTP_READY=true
              fi

              # Check HTTPS port (suppress netcat output)
              if nc -z "$PRIVATE_IP" 7473 >/dev/null 2>&1; then
                echo "Neo4j is accepting connections on HTTPS port (7473)"
                HTTPS_READY=true
              fi

              # If all ports are ready, we're good to go
              if [ "$BOLT_READY" = true ] && [ "$HTTP_READY" = true ] && [ "$HTTPS_READY" = true ]; then
                echo "Neo4j is fully operational on all ports"
                break
              fi
              
              if [ $i -eq 20 ]; then
                echo "Error: Timed out waiting for Neo4j to be ready"
                echo "Bolt port ready: $BOLT_READY"
                echo "HTTP port ready: $HTTP_READY"
                echo "HTTPS port ready: $HTTPS_READY"
                
                # Get user_data script logs to help diagnose the issue
                echo "Checking user_data script logs..."
                aws ec2 get-console-output --instance-id "$INSTANCE_ID" \
                  --query 'Output' --output text | grep -A 50 "user-data"
                
                # Check Neo4j service status and logs
                echo "Checking Neo4j service status and logs..."
                aws ssm send-command \
                  --instance-ids "$INSTANCE_ID" \
                  --document-name "AWS-RunShellScript" \
                  --parameters commands=["systemctl status neo4j; echo '=== Neo4j Logs ==='; journalctl -u neo4j -n 50"] \
                  --query "Commands[0].Output" --output text || true

                # Check Neo4j debug log if available
                echo "Checking Neo4j debug log..."
                aws ssm send-command \
                  --instance-ids "$INSTANCE_ID" \
                  --document-name "AWS-RunShellScript" \
                  --parameters commands=["if [ -f /var/log/neo4j/debug.log ]; then tail -n 50 /var/log/neo4j/debug.log; fi"] \
                  --query "Commands[0].Output" --output text || true

                # Check Neo4j configuration
                echo "Checking Neo4j configuration..."
                aws ssm send-command \
                  --instance-ids "$INSTANCE_ID" \
                  --document-name "AWS-RunShellScript" \
                  --parameters commands=["echo '=== Neo4j Configuration ==='; cat /etc/neo4j/neo4j.conf | grep -v '^#' | grep -v '^$'"] \
                  --query "Commands[0].Output" --output text || true

                # Check system resources
                echo "Checking system resources..."
                aws ssm send-command \
                  --instance-ids "$INSTANCE_ID" \
                  --document-name "AWS-RunShellScript" \
                  --parameters commands=["echo '=== Memory Usage ==='; free -h; echo '=== Disk Usage ==='; df -h; echo '=== Top Processes ==='; top -b -n 1 | head -n 20"] \
                  --query "Commands[0].Output" --output text || true

                # Check Neo4j license status
                echo "Checking Neo4j license status..."
                aws ssm send-command \
                  --instance-ids "$INSTANCE_ID" \
                  --document-name "AWS-RunShellScript" \
                  --parameters commands=["echo '=== Neo4j License ==='; if [ -f /etc/neo4j/neo4j.license ]; then echo 'License file exists'; ls -l /etc/neo4j/neo4j.license; else echo 'License file missing!'; fi; echo '=== Neo4j Version ==='; neo4j --version"] \
                  --query "Commands[0].Output" --output text || true

                # Check Neo4j directory permissions
                echo "Checking Neo4j directory permissions..."
                aws ssm send-command \
                  --instance-ids "$INSTANCE_ID" \
                  --document-name "AWS-RunShellScript" \
                  --parameters commands=["echo '=== Neo4j Directories ==='; ls -l /var/lib/neo4j/; echo '=== Data Directory ==='; ls -l /var/lib/neo4j/data/; echo '=== Directory Ownership ==='; stat -c '%U:%G' /var/lib/neo4j/"] \
                  --query "Commands[0].Output" --output text || true

                # Check SELinux status
                echo "Checking SELinux status..."
                aws ssm send-command \
                  --instance-ids "$INSTANCE_ID" \
                  --document-name "AWS-RunShellScript" \
                  --parameters commands=["echo '=== SELinux Status ==='; sestatus; echo '=== SELinux Context ==='; ls -Z /var/lib/neo4j/; echo '=== Port Context ==='; semanage port -l | grep -E '7474|7473|7687' || true"] \
                  --query "Commands[0].Output" --output text || true

                # Check firewall rules
                echo "Checking firewall rules..."
                aws ssm send-command \
                  --instance-ids "$INSTANCE_ID" \
                  --document-name "AWS-RunShellScript" \
                  --parameters commands=["echo '=== Firewall Status ==='; systemctl status firewalld || true; echo '=== Firewall Rules ==='; firewall-cmd --list-all || true; echo '=== iptables Rules ==='; iptables -L -n || true"] \
                  --query "Commands[0].Output" --output text || true
                
                exit 1
              fi
              
              echo "Waiting 30 seconds before next check (attempt $i/20)..."
              sleep 30
            done
          }

          # Verify both instances
          verify_instance "$LEDGER_ID" "LedgerSpace"
          verify_instance "$SEARCH_ID" "SearchSpace"

          echo "Both Neo4j instances verified successfully"

      - name: Print Database Infrastructure Outputs
        run: |
          cd terraform
          echo "Retrieving database infrastructure outputs..."
          echo "========================================"
          echo "Database Infrastructure Outputs:"
          echo "========================================"

          # Get outputs directly using -raw
          echo "Neo4j LedgerSpace Instance:"
          echo "  Instance ID: $(terraform output -raw neo4j_ledger_instance_id 2>/dev/null | grep -o "i-[a-z0-9]*" | head -n1 || echo 'Not available')"
          echo "  Private IP: $(terraform output -raw neo4j_ledger_private_ip 2>/dev/null || echo 'Not available')"
          echo "  Bolt URL: $(terraform output -raw neo4j_ledger_bolt_endpoint 2>/dev/null || echo 'Not available')"
          LEDGER_IP=$(terraform output -raw neo4j_ledger_private_ip 2>/dev/null || echo 'Not available')
          echo "  HTTP URL: http://${LEDGER_IP}:7474"
          echo "  HTTPS URL: https://${LEDGER_IP}:7473"

          echo ""
          echo "Neo4j SearchSpace Instance:"
          echo "  Instance ID: $(terraform output -raw neo4j_search_instance_id 2>/dev/null | grep -o "i-[a-z0-9]*" | head -n1 || echo 'Not available')"
          echo "  Private IP: $(terraform output -raw neo4j_search_private_ip 2>/dev/null || echo 'Not available')"
          echo "  Bolt URL: $(terraform output -raw neo4j_search_bolt_endpoint 2>/dev/null || echo 'Not available')"
          SEARCH_IP=$(terraform output -raw neo4j_search_private_ip 2>/dev/null || echo 'Not available')
          echo "  HTTP URL: http://${SEARCH_IP}:7474"
          echo "  HTTPS URL: https://${SEARCH_IP}:7473"

          echo "========================================"
          echo "Please save these values securely. You may need to manually set them as GitHub secrets or use them in your application configuration."
          echo "Remember to set up the following secrets:"
          echo "- NEO_4J_LEDGER_SPACE_BOLT_URL"
          echo "- NEO_4J_SEARCH_SPACE_BOLT_URL"
          echo "- NEO_4J_LEDGER_SPACE_USER"
          echo "- NEO_4J_SEARCH_SPACE_USER"
          echo "- NEO_4J_LEDGER_SPACE_PASS"
          echo "- NEO_4J_SEARCH_SPACE_PASS"
          echo "========================================"
