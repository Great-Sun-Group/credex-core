name: Deploy Databases

on:
  workflow_dispatch:

jobs:
  deploy_neo4j:
    runs-on: ubuntu-latest
    environment: ${{ (github.ref == 'refs/heads/prod' && 'production') || (github.ref == 'refs/heads/stage' && 'staging') || 'development' }}

    env:
      ENVIRONMENT: ${{ (github.ref == 'refs/heads/prod' && 'production') || (github.ref == 'refs/heads/stage' && 'staging') || 'development' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: af-south-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Setup and Initialize Terraform Backend
        run: |
          echo "Current environment: ${ENVIRONMENT}"

          # Initialize Terraform
          cd terraform
          echo "Initializing Terraform..."
          terraform init \
            -backend-config="bucket=credexbuckets3-statebucket-${ENVIRONMENT}" \
            -backend-config="key=terraform.tfstate" \
            -backend-config="region=af-south-1" \
            -backend-config="dynamodb_table=credexbuckets3-statebucket-lock-${ENVIRONMENT}"

      - name: Terraform Plan
        env:
          TF_VAR_environment: ${{ env.ENVIRONMENT }}
          TF_VAR_neo4j_enterprise_license: ${{ secrets.NEO4J_ENTERPRISE_LICENSE }}
          # Add dummy values for required variables since they're not used by the databases module
          TF_VAR_jwt_secret: "dummy"
          TF_VAR_client_api_key: "dummy"
          TF_VAR_dev_admin_key: "dummy"
          TF_VAR_skip_rate_limiter_key: "dummy"
          TF_VAR_open_exchange_rates_api: "dummy"
          # Add dummy values for Neo4j bolt URLs that will be replaced with real values after deployment
          TF_VAR_neo_4j_ledger_space_bolt_url: "bolt://dummy-ledger:7687"
          TF_VAR_neo_4j_search_space_bolt_url: "bolt://dummy-search:7687"
          # Add dummy values for Firebase variables since they're not used by the databases module
          TF_VAR_firebase_project_id: "dummy"
          TF_VAR_firebase_client_email: "dummy@project.iam.gserviceaccount.com"
          TF_VAR_firebase_private_key: "dummy-private-key"
        run: |
          cd terraform
          echo "Current environment: ${ENVIRONMENT}"
          echo "Planning Terraform changes..."
          terraform plan -input=false -out=tfplan -target=module.databases -replace="module.databases.aws_instance.neo4j_ledger" -replace="module.databases.aws_instance.neo4j_search"

      - name: Terraform Apply
        env:
          TF_VAR_environment: ${{ env.ENVIRONMENT }}
          TF_VAR_neo4j_enterprise_license: ${{ secrets.NEO4J_ENTERPRISE_LICENSE }}
          # Add dummy values for required variables since they're not used by the databases module
          TF_VAR_jwt_secret: "dummy"
          TF_VAR_client_api_key: "dummy"
          TF_VAR_dev_admin_key: "dummy"
          TF_VAR_skip_rate_limiter_key: "dummy"
          # Add dummy values for Neo4j bolt URLs that will be replaced with real values after deployment
          TF_VAR_neo_4j_ledger_space_bolt_url: "bolt://dummy-ledger:7687"
          TF_VAR_neo_4j_search_space_bolt_url: "bolt://dummy-search:7687"
          # Add dummy values for Firebase variables since they're not used by the databases module
          TF_VAR_firebase_project_id: "dummy"
          TF_VAR_firebase_client_email: "dummy@project.iam.gserviceaccount.com"
          TF_VAR_firebase_private_key: "dummy-private-key"
        run: |
          cd terraform
          echo "Current environment: ${ENVIRONMENT}"
          echo "Applying Terraform changes..."

          if ! terraform apply -auto-approve -input=false tfplan; then
            echo "Error: Terraform apply failed"
            echo "Checking terraform logs for details..."
            terraform show tfplan
            exit 1
          fi

          echo "Terraform apply completed successfully"

      - name: Verify and Install Neo4j
        run: |
          cd terraform
          echo "Verifying EC2 instances and installing Neo4j..."

          # Get instance IDs and IPs
          LEDGER_ID=$(terraform output -raw neo4j_ledger_instance_id 2>/dev/null | grep -o "i-[a-z0-9]*" | head -n 1 | tr -d '\n' || echo "")
          SEARCH_ID=$(terraform output -raw neo4j_search_instance_id 2>/dev/null | grep -o "i-[a-z0-9]*" | head -n 1 | tr -d '\n' || echo "")

          if [ -z "$LEDGER_ID" ] || [ -z "$SEARCH_ID" ]; then
            echo "Error: Could not get Neo4j instance IDs"
            exit 1
          fi

          echo "Retrieved instance IDs:"
          echo "LedgerSpace: $LEDGER_ID"
          echo "SearchSpace: $SEARCH_ID"

          # Function to verify instance and install Neo4j
          install_neo4j() {
            local INSTANCE_ID=$1
            local SPACE_NAME=$2
            
            echo "Verifying $SPACE_NAME instance ($INSTANCE_ID)..."
            
            # Wait for instance to be running
            echo "Waiting for instance to be running..."
            aws ec2 wait instance-running --instance-ids "$INSTANCE_ID"
            
            # Wait for status checks
            echo "Waiting for status checks to pass..."
            aws ec2 wait instance-status-ok --instance-ids "$INSTANCE_ID"
            
            # Get instance details
            INSTANCE_DETAILS=$(aws ec2 describe-instances --instance-ids "$INSTANCE_ID")
            PRIVATE_IP=$(echo $INSTANCE_DETAILS | jq -r '.Reservations[0].Instances[0].PrivateIpAddress')
            
            echo "$SPACE_NAME instance is running:"
            echo "Instance ID: $INSTANCE_ID"
            echo "Private IP: $PRIVATE_IP"
            
            # Verify instance is responding
            echo "Checking instance system status..."
            aws ec2 describe-instance-status \
              --instance-ids "$INSTANCE_ID" \
              --query 'InstanceStatuses[0].{SystemStatus:SystemStatus.Status,InstanceStatus:InstanceStatus.Status}' \
              --output table
            
            # Manually install Neo4j using SSM
            echo "Installing Neo4j on $SPACE_NAME instance..."
            COMMAND_ID=$(aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name "AWS-RunShellScript" \
              --parameters '{"commands":[
                "# Accept Neo4j license agreement",
                "export NEO4J_ACCEPT_LICENSE_AGREEMENT=yes",
                
                "# Install Java 17",
                "echo \"Installing Java 17...\"",
                "yum install -y java-17-amazon-corretto",
                
                "# Import Neo4j GPG key",
                "echo \"Importing Neo4j GPG key...\"",
                "rpm --import https://debian.neo4j.com/neotechnology.gpg.key",
                
                "# Configure Neo4j repository",
                "echo \"Configuring Neo4j repository...\"",
                "cat > /etc/yum.repos.d/neo4j.repo << EOF",
                "[neo4j]",
                "name=Neo4j RPM Repository",
                "baseurl=https://yum.neo4j.com/stable/5",
                "enabled=1",
                "gpgcheck=1",
                "EOF",
                
                "# Install Neo4j Enterprise",
                "echo \"Installing Neo4j Enterprise...\"",
                "sudo -E yum install -y neo4j-enterprise",
                
                "# Configure Neo4j",
                "echo \"Configuring Neo4j...\"",
                "cat > /etc/neo4j/neo4j.conf << EOF",
                "# Network configuration",
                "server.default_listen_address=0.0.0.0",
                "server.bolt.listen_address=0.0.0.0:7687",
                "server.http.listen_address=0.0.0.0:7474",
                "server.https.listen_address=0.0.0.0:7473",
                "",
                "# Security settings",
                "dbms.security.auth_enabled=false",
                "dbms.default_database=neo4j",
                "",
                "# Memory configuration - reduced for testing",
                "server.memory.heap.initial_size=512m",
                "server.memory.heap.max_size=512m",
                "server.memory.pagecache.size=512m",
                "",
                "# Connectivity settings",
                "dbms.routing.enabled=true",
                "dbms.routing.default_router=SERVER",
                "dbms.connector.bolt.tls_level=DISABLED",
                "dbms.connector.http.enabled=true",
                "dbms.connector.https.enabled=true",
                "EOF",
                "",
                "# Ensure Neo4j user owns the config",
                "chown -R neo4j:neo4j /etc/neo4j",
                
                "# Enable and start Neo4j service",
                "echo \"Enabling and starting Neo4j service...\"",
                "systemctl enable neo4j",
                "systemctl start neo4j",
                
                "# Verify Neo4j is running",
                "echo \"Verifying Neo4j is running...\"",
                "systemctl status neo4j",
                "ss -tlnp | grep java"
              ]}' \
              --query "Command.CommandId" --output text)
            
            echo "Waiting for Neo4j installation to complete (Command ID: $COMMAND_ID)..."
            sleep 30
            
            # Check command status
            COMMAND_STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query "Status" --output text)
            echo "Installation command status: $COMMAND_STATUS"
            
            # Get command output
            echo "Installation command output:"
            aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query "StandardOutputContent" --output text
            
            # Wait for Neo4j to start
            echo "Waiting for Neo4j to initialize (90 seconds)..."
            sleep 90
            
            # Verify Neo4j is running
            echo "Verifying Neo4j is running..."
            VERIFY_COMMAND_ID=$(aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name "AWS-RunShellScript" \
              --parameters '{"commands":["systemctl status neo4j", "ss -tlnp | grep java", "cypher-shell --non-interactive \"RETURN 1 AS test;\""]}' \
              --query "Command.CommandId" --output text)
            
            sleep 10
            
            # Get verification output
            echo "Verification command output:"
            VERIFY_OUTPUT=$(aws ssm get-command-invocation --command-id "$VERIFY_COMMAND_ID" --instance-id "$INSTANCE_ID" --query "StandardOutputContent" --output text)
            echo "$VERIFY_OUTPUT"
            
            # Check if Neo4j is running and responding to queries
            if echo "$VERIFY_OUTPUT" | grep -q "Active: active (running)" && echo "$VERIFY_OUTPUT" | grep -q "7687" && echo "$VERIFY_OUTPUT" | grep -q "test"; then
              echo "Neo4j is running successfully on $SPACE_NAME"
              return 0
            else
              echo "Warning: Neo4j may not be running properly on $SPACE_NAME"
              echo "Will verify with direct connection testing later"
              return 0
            fi
          }

          # Install Neo4j on both instances
          install_neo4j "$LEDGER_ID" "LedgerSpace"
          install_neo4j "$SEARCH_ID" "SearchSpace"

          echo "Neo4j installation completed on both instances"

      - name: Install Neo4j Driver for Direct Connection Testing
        run: |
          npm install neo4j-driver

      - name: Verify Neo4j Connectivity
        run: |
          cd terraform
          echo "Verifying Neo4j connectivity..."

          # Get instance IPs
          LEDGER_IP=$(terraform output -raw neo4j_ledger_private_ip 2>/dev/null | grep -o '[0-9]\+\.[0-9]\+\.[0-9]\+\.[0-9]\+' | head -n 1 || echo "")
          SEARCH_IP=$(terraform output -raw neo4j_search_private_ip 2>/dev/null | grep -o '[0-9]\+\.[0-9]\+\.[0-9]\+\.[0-9]\+' | head -n 1 || echo "")

          if [ -z "$LEDGER_IP" ] || [ -z "$SEARCH_IP" ]; then
            echo "Error: Could not get Neo4j instance IPs"
            exit 1
          fi

          echo "Neo4j instance IPs:"
          echo "LedgerSpace: $LEDGER_IP"
          echo "SearchSpace: $SEARCH_IP"

          # Create a simple Node.js script to test Neo4j connectivity
          cat > test-neo4j-connection.js << 'EOL'
          const neo4j = require('neo4j-driver');

          async function testConnection(uri) {
            console.log(`Testing connection to: ${uri}`);
            const driver = neo4j.driver(uri, neo4j.auth.basic('neo4j', 'neo4j'));
            
            try {
              const session = driver.session();
              try {
                console.log('Running test query...');
                const result = await session.run('RETURN 1 AS test');
                console.log('Query result:', result.records[0].get('test').toNumber());
                console.log('Connection successful!');
                return true;
              } finally {
                await session.close();
              }
            } catch (error) {
              console.error('Connection failed:', error.message);
              return false;
            } finally {
              await driver.close();
            }
          }

          async function main() {
            const uri = process.argv[2];
            if (!uri) {
              console.error('Usage: node test-neo4j-connection.js bolt://host:port');
              process.exit(1);
            }
            
            // Try multiple times with increasing backoff
            const MAX_RETRIES = 15;
            let success = false;
            
            for (let i = 0; i < MAX_RETRIES; i++) {
              console.log(`\nAttempt ${i + 1}/${MAX_RETRIES}`);
              success = await testConnection(uri);
              
              if (success) {
                console.log('Neo4j connection verified successfully!');
                process.exit(0);
              }
              
              if (i < MAX_RETRIES - 1) {
                const waitTime = 15 * (i + 1) * 1000; // Increasing backoff
                console.log(`Retrying in ${waitTime/1000} seconds...`);
                await new Promise(resolve => setTimeout(resolve, waitTime));
              }
            }
            
            console.error('Failed to connect to Neo4j after multiple attempts');
            process.exit(1);
          }

          main().catch(error => {
            console.error('Unhandled error:', error);
            process.exit(1);
          });
          EOL

          # Function to verify Neo4j connectivity using direct connection
          verify_neo4j_connectivity() {
            local IP=$1
            local SPACE_NAME=$2
            local BOLT_URL="bolt://${IP}:7687"
            
            echo "Verifying Neo4j connectivity on $SPACE_NAME ($BOLT_URL)..."
            
            # Test connection using Neo4j driver
            echo "Testing direct connection to Neo4j using Neo4j driver..."
            if node test-neo4j-connection.js "$BOLT_URL"; then
              echo "$SPACE_NAME connectivity verification successful"
              return 0
            else
              echo "Error: $SPACE_NAME connectivity verification failed"
              return 1
            fi
          }

          # Verify Neo4j connectivity on both instances
          if verify_neo4j_connectivity "$LEDGER_IP" "LedgerSpace"; then
            echo "LedgerSpace connectivity verification successful"
          else
            echo "LedgerSpace connectivity verification failed"
            exit 1
          fi

          if verify_neo4j_connectivity "$SEARCH_IP" "SearchSpace"; then
            echo "SearchSpace connectivity verification successful"
          else
            echo "SearchSpace connectivity verification failed"
            exit 1
          fi

          echo "Neo4j connectivity verified successfully on both instances"

      - name: Print Database Infrastructure Outputs
        run: |
          cd terraform
          echo "Retrieving database infrastructure outputs..."
          echo "========================================"
          echo "Database Infrastructure Outputs:"
          echo "========================================"

          # Get individual outputs directly and clean them
          LEDGER_ID=$(terraform output -raw neo4j_ledger_instance_id 2>/dev/null | grep -o "i-[a-z0-9]*" | head -n 1 | tr -d '\n' || echo "")
          LEDGER_IP=$(terraform output -raw neo4j_ledger_private_ip 2>/dev/null | head -n 1 | tr -d '\n' || echo "")
          LEDGER_BOLT=$(terraform output -raw neo4j_ledger_bolt_endpoint 2>/dev/null | head -n 1 | tr -d '\n' || echo "")

          SEARCH_ID=$(terraform output -raw neo4j_search_instance_id 2>/dev/null | grep -o "i-[a-z0-9]*" | head -n 1 | tr -d '\n' || echo "")
          SEARCH_IP=$(terraform output -raw neo4j_search_private_ip 2>/dev/null | head -n 1 | tr -d '\n' || echo "")
          SEARCH_BOLT=$(terraform output -raw neo4j_search_bolt_endpoint 2>/dev/null | head -n 1 | tr -d '\n' || echo "")

          # Print LedgerSpace details
          echo "Neo4j LedgerSpace Instance:"
          echo "  Instance ID: $LEDGER_ID"
          echo "  Private IP: $LEDGER_IP"
          echo "  Bolt URL: $LEDGER_BOLT"
          echo "  HTTP URL: http://$LEDGER_IP:7474"
          echo "  HTTPS URL: https://$LEDGER_IP:7473"

          echo ""
          echo "Neo4j SearchSpace Instance:"
          echo "  Instance ID: $SEARCH_ID"
          echo "  Private IP: $SEARCH_IP"
          echo "  Bolt URL: $SEARCH_BOLT"
          echo "  HTTP URL: http://$SEARCH_IP:7474"
          echo "  HTTPS URL: https://$SEARCH_IP:7473"

          echo "========================================"
          echo "Please save these values securely. You may need to manually set them as GitHub secrets or use them in your application configuration."
          echo "Remember to set up the following secrets:"
          echo "- NEO_4J_LEDGER_SPACE_BOLT_URL"
          echo "- NEO_4J_SEARCH_SPACE_BOLT_URL"
          echo "========================================"
