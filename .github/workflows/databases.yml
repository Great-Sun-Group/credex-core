name: Deploy Databases

on:
  workflow_dispatch:

jobs:
  deploy_neo4j:
    runs-on: ubuntu-latest
    environment: ${{ (github.ref == 'refs/heads/prod' && 'production') || (github.ref == 'refs/heads/stage' && 'staging') || 'development' }}

    env:
      ENVIRONMENT: ${{ (github.ref == 'refs/heads/prod' && 'production') || (github.ref == 'refs/heads/stage' && 'staging') || 'development' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: af-south-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Setup and Initialize Terraform Backend
        run: |
          echo "Current environment: ${ENVIRONMENT}"

          # Initialize Terraform
          cd terraform
          echo "Initializing Terraform..."
          terraform init \
            -backend-config="bucket=credexbuckets3-statebucket-${ENVIRONMENT}" \
            -backend-config="key=terraform.tfstate" \
            -backend-config="region=af-south-1" \
            -backend-config="dynamodb_table=credexbuckets3-statebucket-lock-${ENVIRONMENT}"

      - name: Terraform Plan
        env:
          TF_VAR_environment: ${{ env.ENVIRONMENT }}
          TF_VAR_neo4j_enterprise_license: ${{ secrets.NEO4J_ENTERPRISE_LICENSE }}
          # Add dummy values for required variables since they're not used by the databases module
          TF_VAR_jwt_secret: "dummy"
          TF_VAR_client_api_key: "dummy"
          TF_VAR_dev_admin_key: "dummy"
          TF_VAR_skip_rate_limiter_key: "dummy"
          TF_VAR_open_exchange_rates_api: "dummy"
          # Add dummy values for Neo4j bolt URLs that will be replaced with real values after deployment
          TF_VAR_neo_4j_ledger_space_bolt_url: "bolt://dummy-ledger:7687"
          TF_VAR_neo_4j_search_space_bolt_url: "bolt://dummy-search:7687"
          # Add dummy values for Firebase variables since they're not used by the databases module
          TF_VAR_firebase_project_id: "dummy"
          TF_VAR_firebase_client_email: "dummy@project.iam.gserviceaccount.com"
          TF_VAR_firebase_private_key: "dummy-private-key"
        run: |
          cd terraform
          echo "Current environment: ${ENVIRONMENT}"
          echo "Planning Terraform changes..."
          terraform plan -input=false -out=tfplan -target=module.databases -replace="module.databases.aws_instance.neo4j_ledger" -replace="module.databases.aws_instance.neo4j_search"

      - name: Terraform Apply
        env:
          TF_VAR_environment: ${{ env.ENVIRONMENT }}
          TF_VAR_neo4j_enterprise_license: ${{ secrets.NEO4J_ENTERPRISE_LICENSE }}
          # Add dummy values for required variables since they're not used by the databases module
          TF_VAR_jwt_secret: "dummy"
          TF_VAR_client_api_key: "dummy"
          TF_VAR_dev_admin_key: "dummy"
          TF_VAR_skip_rate_limiter_key: "dummy"
          # Add dummy values for Neo4j bolt URLs that will be replaced with real values after deployment
          TF_VAR_neo_4j_ledger_space_bolt_url: "bolt://dummy-ledger:7687"
          TF_VAR_neo_4j_search_space_bolt_url: "bolt://dummy-search:7687"
          # Add dummy values for Firebase variables since they're not used by the databases module
          TF_VAR_firebase_project_id: "dummy"
          TF_VAR_firebase_client_email: "dummy@project.iam.gserviceaccount.com"
          TF_VAR_firebase_private_key: "dummy-private-key"
        run: |
          cd terraform
          echo "Current environment: ${ENVIRONMENT}"
          echo "Applying Terraform changes..."

          if ! terraform apply -auto-approve -input=false tfplan; then
            echo "Error: Terraform apply failed"
            echo "Checking terraform logs for details..."
            terraform show tfplan
            exit 1
          fi

          echo "Terraform apply completed successfully"

      - name: Verify EC2 Instances
        run: |
          cd terraform
          echo "Verifying EC2 instances..."

          # Get instance IDs and IPs
          LEDGER_ID=$(terraform output -raw neo4j_ledger_instance_id 2>/dev/null | grep -o "i-[a-z0-9]*" | head -n 1 | tr -d '\n' || echo "")
          SEARCH_ID=$(terraform output -raw neo4j_search_instance_id 2>/dev/null | grep -o "i-[a-z0-9]*" | head -n 1 | tr -d '\n' || echo "")

          if [ -z "$LEDGER_ID" ] || [ -z "$SEARCH_ID" ]; then
            echo "Error: Could not get Neo4j instance IDs"
            exit 1
          fi

          echo "Retrieved instance IDs:"
          echo "LedgerSpace: $LEDGER_ID"
          echo "SearchSpace: $SEARCH_ID"

          # Function to verify instance
          verify_instance() {
            local INSTANCE_ID=$1
            local SPACE_NAME=$2
            
            echo "Verifying $SPACE_NAME instance ($INSTANCE_ID)..."
            
            # Wait for instance to be running
            echo "Waiting for instance to be running..."
            aws ec2 wait instance-running --instance-ids "$INSTANCE_ID"
            
            # Wait for status checks
            echo "Waiting for status checks to pass..."
            aws ec2 wait instance-status-ok --instance-ids "$INSTANCE_ID"
            
            # Get instance details
            INSTANCE_DETAILS=$(aws ec2 describe-instances --instance-ids "$INSTANCE_ID")
            PRIVATE_IP=$(echo $INSTANCE_DETAILS | jq -r '.Reservations[0].Instances[0].PrivateIpAddress')
            
            echo "$SPACE_NAME instance is running:"
            echo "Instance ID: $INSTANCE_ID"
            echo "Private IP: $PRIVATE_IP"
            
            # Verify instance is responding
            echo "Checking instance system status..."
            aws ec2 describe-instance-status \
              --instance-ids "$INSTANCE_ID" \
              --query 'InstanceStatuses[0].{SystemStatus:SystemStatus.Status,InstanceStatus:InstanceStatus.Status}' \
              --output table
            
            return 0
          }

          # Verify both instances
          if ! verify_instance "$LEDGER_ID" "LedgerSpace"; then
            echo "ERROR: Failed to verify LedgerSpace instance"
            exit 1
          fi

          if ! verify_instance "$SEARCH_ID" "SearchSpace"; then
            echo "ERROR: Failed to verify SearchSpace instance"
            exit 1
          fi

          echo "EC2 instances verified successfully"

          # Export instance IDs and IPs for later steps
          echo "LEDGER_ID=$LEDGER_ID" >> $GITHUB_ENV
          echo "SEARCH_ID=$SEARCH_ID" >> $GITHUB_ENV

          # Get private IPs
          LEDGER_IP=$(aws ec2 describe-instances --instance-ids "$LEDGER_ID" --query 'Reservations[0].Instances[0].PrivateIpAddress' --output text)
          SEARCH_IP=$(aws ec2 describe-instances --instance-ids "$SEARCH_ID" --query 'Reservations[0].Instances[0].PrivateIpAddress' --output text)

          echo "LEDGER_IP=$LEDGER_IP" >> $GITHUB_ENV
          echo "SEARCH_IP=$SEARCH_IP" >> $GITHUB_ENV

      - name: Upload Scripts to Instances
        run: |
          echo "Uploading scripts to instances..."

          # Upload scripts to S3
          aws s3 cp .github/scripts/install_neo4j.sh s3://credexbuckets3-statebucket-${{ env.ENVIRONMENT }}/scripts/install_neo4j.sh
          aws s3 cp .github/scripts/verify_neo4j.sh s3://credexbuckets3-statebucket-${{ env.ENVIRONMENT }}/scripts/verify_neo4j.sh

          # Copy scripts from S3 to instances
          aws ssm send-command \
            --instance-ids "${{ env.LEDGER_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=['aws s3 cp s3://credexbuckets3-statebucket-${{ env.ENVIRONMENT }}/scripts/install_neo4j.sh /tmp/install_neo4j.sh && aws s3 cp s3://credexbuckets3-statebucket-${{ env.ENVIRONMENT }}/scripts/verify_neo4j.sh /tmp/verify_neo4j.sh && chmod +x /tmp/install_neo4j.sh /tmp/verify_neo4j.sh']" \
            --comment "Copy scripts to LedgerSpace instance"

          aws ssm send-command \
            --instance-ids "${{ env.SEARCH_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=['aws s3 cp s3://credexbuckets3-statebucket-${{ env.ENVIRONMENT }}/scripts/install_neo4j.sh /tmp/install_neo4j.sh && aws s3 cp s3://credexbuckets3-statebucket-${{ env.ENVIRONMENT }}/scripts/verify_neo4j.sh /tmp/verify_neo4j.sh && chmod +x /tmp/install_neo4j.sh /tmp/verify_neo4j.sh']" \
            --comment "Copy scripts to SearchSpace instance"

          echo "Scripts uploaded to instances"

      - name: Run Install Script on LedgerSpace
        run: |
          echo "Running install_neo4j.sh on LedgerSpace instance..."

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ env.LEDGER_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=['export PRIVATE_IP=${{ env.LEDGER_IP }} && bash -ex /tmp/install_neo4j.sh']" \
            --output-s3-bucket-name "credexbuckets3-statebucket-${{ env.ENVIRONMENT }}" \
            --output-s3-key-prefix "ssm-logs/ledgerspace-install" \
            --comment "Install Neo4j on LedgerSpace instance" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          # Wait for command to complete
          echo "Waiting for install command to complete..."
          if ! aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "${{ env.LEDGER_ID }}"; then
            echo "ERROR: Command execution failed or timed out"
            
            # Try to get command details even if wait failed
            echo "Getting command details..."
            aws ssm describe-command-invocations \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ env.LEDGER_ID }}" \
              --details || echo "Failed to get command details"
            
            # Try to get command output
            echo "Getting command output..."
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ env.LEDGER_ID }}" \
              --query "StandardOutputContent" \
              --output text || echo "Failed to get command output"
            
            echo "Getting command error output..."
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ env.LEDGER_ID }}" \
              --query "StandardErrorContent" \
              --output text || echo "Failed to get error output"
            
            # Get S3 logs location
            echo "S3 logs location: s3://credexbuckets3-statebucket-${{ env.ENVIRONMENT }}/ssm-logs/ledgerspace-install/"
            
            exit 1
          fi
          
          # Get command output
          echo "Getting command output..."
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ env.LEDGER_ID }}" \
            --query "StandardOutputContent" \
            --output text || echo "Failed to get command output"
          
          echo "Getting command error output..."
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ env.LEDGER_ID }}" \
            --query "StandardErrorContent" \
            --output text || echo "Failed to get error output"
          
          # Check command status
          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ env.LEDGER_ID }}" \
            --query "Status" \
            --output text)
          
          echo "Command status: $STATUS"
          
          if [[ "$STATUS" != "Success" ]]; then
            echo "ERROR: Neo4j installation on LedgerSpace instance failed with status: $STATUS"
            echo "S3 logs location: s3://credexbuckets3-statebucket-${{ env.ENVIRONMENT }}/ssm-logs/ledgerspace-install/"
            exit 1
          fi
          
          echo "Installation of Neo4j on LedgerSpace instance completed successfully"
          echo "LEDGER_INSTALL_STATUS=$STATUS" >> $GITHUB_ENV

      - name: Run Install Script on SearchSpace
        run: |
          echo "Running install_neo4j.sh on SearchSpace instance..."

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ env.SEARCH_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=['export PRIVATE_IP=${{ env.SEARCH_IP }} && bash -ex /tmp/install_neo4j.sh']" \
            --output-s3-bucket-name "credexbuckets3-statebucket-${{ env.ENVIRONMENT }}" \
            --output-s3-key-prefix "ssm-logs/searchspace-install" \
            --comment "Install Neo4j on SearchSpace instance" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          # Wait for command to complete
          echo "Waiting for install command to complete..."
          if ! aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "${{ env.SEARCH_ID }}"; then
            echo "ERROR: Command execution failed or timed out"
            
            # Try to get command details even if wait failed
            echo "Getting command details..."
            aws ssm describe-command-invocations \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ env.SEARCH_ID }}" \
              --details || echo "Failed to get command details"
            
            # Try to get command output
            echo "Getting command output..."
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ env.SEARCH_ID }}" \
              --query "StandardOutputContent" \
              --output text || echo "Failed to get command output"
            
            echo "Getting command error output..."
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ env.SEARCH_ID }}" \
              --query "StandardErrorContent" \
              --output text || echo "Failed to get error output"
            
            # Get S3 logs location
            echo "S3 logs location: s3://credexbuckets3-statebucket-${{ env.ENVIRONMENT }}/ssm-logs/searchspace-install/"
            
            exit 1
          fi
          
          # Get command output
          echo "Getting command output..."
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ env.SEARCH_ID }}" \
            --query "StandardOutputContent" \
            --output text || echo "Failed to get command output"
          
          echo "Getting command error output..."
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ env.SEARCH_ID }}" \
            --query "StandardErrorContent" \
            --output text || echo "Failed to get error output"
          
          # Check command status
          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ env.SEARCH_ID }}" \
            --query "Status" \
            --output text)
          
          echo "Command status: $STATUS"
          
          if [[ "$STATUS" != "Success" ]]; then
            echo "ERROR: Neo4j installation on SearchSpace instance failed with status: $STATUS"
            echo "S3 logs location: s3://credexbuckets3-statebucket-${{ env.ENVIRONMENT }}/ssm-logs/searchspace-install/"
            exit 1
          fi
          
          echo "Installation of Neo4j on SearchSpace instance completed successfully"
          echo "SEARCH_INSTALL_STATUS=$STATUS" >> $GITHUB_ENV

      - name: Run Verify Script on LedgerSpace
        run: |
          echo "Running verify_neo4j.sh on LedgerSpace instance..."

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ env.LEDGER_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=['bash -ex /tmp/verify_neo4j.sh']" \
            --output-s3-bucket-name "credexbuckets3-statebucket-${{ env.ENVIRONMENT }}" \
            --output-s3-key-prefix "ssm-logs/ledgerspace-verify" \
            --comment "Verify Neo4j on LedgerSpace instance" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          # Wait for command to complete
          echo "Waiting for verify command to complete..."
          if ! aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "${{ env.LEDGER_ID }}"; then
            echo "ERROR: Command execution failed or timed out"
            
            # Try to get command details even if wait failed
            echo "Getting command details..."
            aws ssm describe-command-invocations \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ env.LEDGER_ID }}" \
              --details || echo "Failed to get command details"
            
            # Try to get command output
            echo "Getting command output..."
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ env.LEDGER_ID }}" \
              --query "StandardOutputContent" \
              --output text || echo "Failed to get command output"
            
            echo "Getting command error output..."
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ env.LEDGER_ID }}" \
              --query "StandardErrorContent" \
              --output text || echo "Failed to get error output"
            
            # Get S3 logs location
            echo "S3 logs location: s3://credexbuckets3-statebucket-${{ env.ENVIRONMENT }}/ssm-logs/ledgerspace-verify/"
            
            exit 1
          fi
          
          # Get command output
          echo "Getting command output..."
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ env.LEDGER_ID }}" \
            --query "StandardOutputContent" \
            --output text || echo "Failed to get command output"
          
          echo "Getting command error output..."
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ env.LEDGER_ID }}" \
            --query "StandardErrorContent" \
            --output text || echo "Failed to get error output"
          
          # Check command status
          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ env.LEDGER_ID }}" \
            --query "Status" \
            --output text)
          
          echo "Command status: $STATUS"
          
          if [[ "$STATUS" != "Success" ]]; then
            echo "ERROR: Neo4j verification on LedgerSpace instance failed with status: $STATUS"
            echo "S3 logs location: s3://credexbuckets3-statebucket-${{ env.ENVIRONMENT }}/ssm-logs/ledgerspace-verify/"
            exit 1
          fi
          
          echo "Verification of Neo4j on LedgerSpace instance completed successfully"
          echo "LEDGER_VERIFY_STATUS=$STATUS" >> $GITHUB_ENV

      - name: Run Verify Script on SearchSpace
        run: |
          echo "Running verify_neo4j.sh on SearchSpace instance..."

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ env.SEARCH_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=['bash -ex /tmp/verify_neo4j.sh']" \
            --output-s3-bucket-name "credexbuckets3-statebucket-${{ env.ENVIRONMENT }}" \
            --output-s3-key-prefix "ssm-logs/searchspace-verify" \
            --comment "Verify Neo4j on SearchSpace instance" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          # Wait for command to complete
          echo "Waiting for verify command to complete..."
          if ! aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "${{ env.SEARCH_ID }}"; then
            echo "ERROR: Command execution failed or timed out"
            
            # Try to get command details even if wait failed
            echo "Getting command details..."
            aws ssm describe-command-invocations \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ env.SEARCH_ID }}" \
              --details || echo "Failed to get command details"
            
            # Try to get command output
            echo "Getting command output..."
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ env.SEARCH_ID }}" \
              --query "StandardOutputContent" \
              --output text || echo "Failed to get command output"
            
            echo "Getting command error output..."
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ env.SEARCH_ID }}" \
              --query "StandardErrorContent" \
              --output text || echo "Failed to get error output"
            
            # Get S3 logs location
            echo "S3 logs location: s3://credexbuckets3-statebucket-${{ env.ENVIRONMENT }}/ssm-logs/searchspace-verify/"
            
            exit 1
          fi
          
          # Get command output
          echo "Getting command output..."
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ env.SEARCH_ID }}" \
            --query "StandardOutputContent" \
            --output text || echo "Failed to get command output"
          
          echo "Getting command error output..."
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ env.SEARCH_ID }}" \
            --query "StandardErrorContent" \
            --output text || echo "Failed to get error output"
          
          # Check command status
          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ env.SEARCH_ID }}" \
            --query "Status" \
            --output text)
          
          echo "Command status: $STATUS"
          
          if [[ "$STATUS" != "Success" ]]; then
            echo "ERROR: Neo4j verification on SearchSpace instance failed with status: $STATUS"
            echo "S3 logs location: s3://credexbuckets3-statebucket-${{ env.ENVIRONMENT }}/ssm-logs/searchspace-verify/"
            exit 1
          fi
          
          echo "Verification of Neo4j on SearchSpace instance completed successfully"
          echo "SEARCH_VERIFY_STATUS=$STATUS" >> $GITHUB_ENV

      - name: Print Database Infrastructure Outputs
        run: |
          cd terraform
          echo "Retrieving database infrastructure outputs..."
          echo "========================================"
          echo "Database Infrastructure Outputs:"
          echo "========================================"

          # Get individual outputs directly and clean them
          LEDGER_ID=$(terraform output -raw neo4j_ledger_instance_id 2>/dev/null | grep -o "i-[a-z0-9]*" | head -n 1 | tr -d '\n' || echo "")
          LEDGER_IP=$(terraform output -raw neo4j_ledger_private_ip 2>/dev/null | head -n 1 | tr -d '\n' || echo "")
          LEDGER_BOLT=$(terraform output -raw neo4j_ledger_bolt_endpoint 2>/dev/null | head -n 1 | tr -d '\n' || echo "")

          SEARCH_ID=$(terraform output -raw neo4j_search_instance_id 2>/dev/null | grep -o "i-[a-z0-9]*" | head -n 1 | tr -d '\n' || echo "")
          SEARCH_IP=$(terraform output -raw neo4j_search_private_ip 2>/dev/null | head -n 1 | tr -d '\n' || echo "")
          SEARCH_BOLT=$(terraform output -raw neo4j_search_bolt_endpoint 2>/dev/null | head -n 1 | tr -d '\n' || echo "")

          # Print LedgerSpace details
          echo "Neo4j LedgerSpace Instance:"
          echo "  Instance ID: $LEDGER_ID"
          echo "  Private IP: $LEDGER_IP"
          echo "  Bolt URL: $LEDGER_BOLT"
          echo "  HTTP URL: http://$LEDGER_IP:7474"
          echo "  HTTPS URL: https://$LEDGER_IP:7473"
          echo "  Install Status: ${{ env.LEDGER_INSTALL_STATUS }}"
          echo "  Verify Status: ${{ env.LEDGER_VERIFY_STATUS }}"

          echo ""
          echo "Neo4j SearchSpace Instance:"
          echo "  Instance ID: $SEARCH_ID"
          echo "  Private IP: $SEARCH_IP"
          echo "  Bolt URL: $SEARCH_BOLT"
          echo "  HTTP URL: http://$SEARCH_IP:7474"
          echo "  HTTPS URL: https://$SEARCH_IP:7473"
          echo "  Install Status: ${{ env.SEARCH_INSTALL_STATUS }}"
          echo "  Verify Status: ${{ env.SEARCH_VERIFY_STATUS }}"

          echo "========================================"
          echo "Please save these values securely. You may need to manually set them as GitHub secrets or use them in your application configuration."
          echo "Remember to set up the following secrets:"
          echo "- NEO_4J_LEDGER_SPACE_BOLT_URL"
          echo "- NEO_4J_SEARCH_SPACE_BOLT_URL"
          echo "========================================"
