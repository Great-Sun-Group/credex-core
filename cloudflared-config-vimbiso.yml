# Cloudflared Configuration for Vimbiso Production Only
# This configuration routes vimbisopay.africa through the Vimbiso tunnel

# Vimbiso Tunnel Configuration
tunnel: 8ef6eec4-04dd-4d58-bd90-f8c3d180df6b
credentials-file: C:\Users\RyanLuke\.cloudflared\8ef6eec4-04dd-4d58-bd90-f8c3d180df6b.json

# Ingress rules - order matters!
ingress:
  # Vimbiso ChatServer routes
  - hostname: vimbisopay.africa
    service: http://127.0.0.1:9000
    originRequest:
      httpHostHeader: vimbisopay.africa
  - hostname: www.vimbisopay.africa
    service: http://127.0.0.1:9000
    originRequest:
      httpHostHeader: vimbisopay.africa
  - hostname: api.vimbisopay.africa
    service: http://127.0.0.1:9000
    originRequest:
      httpHostHeader: vimbisopay.africa
  
  # New domain: vimbisopay.co.zw
  - hostname: vimbisopay.co.zw
    service: http://127.0.0.1:9000
    originRequest:
      httpHostHeader: vimbisopay.co.zw
  - hostname: www.vimbisopay.co.zw
    service: http://127.0.0.1:9000
    originRequest:
      httpHostHeader: vimbisopay.co.zw
  - hostname: api.vimbisopay.co.zw
    service: http://127.0.0.1:9000
    originRequest:
      httpHostHeader: vimbisopay.co.zw
  
  # Catch-all rule (required)
  - service: http_status:404

# Logging configuration
loglevel: info
logfile: C:\Great-Sun-Group\credex-core\logs\cloudflared-vimbiso.log

# Connection settings
retries: 3
grace-period: 30s
